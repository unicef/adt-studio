name: Staging Build

on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: "Staging branch created by CI"
        required: true
        type: string
      staging_version:
        description: "Version calculated by CI"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-build-${{ inputs.staging_ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Validate staging branch
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
        run: |
          if [[ ! "$STAGING_REF" =~ ^staging/pr-[0-9]+-[0-9a-f]{8}$ ]]; then
            echo "::error::Invalid staging branch: $STAGING_REF"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.staging_ref }}
          fetch-depth: 0

      - name: Validate staging version
        id: version
        shell: bash
        env:
          STAGING_REF: ${{ inputs.staging_ref }}
          STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          if [[ ! "$STAGING_REF" =~ ^staging/pr-([1-9][0-9]*)-([0-9a-f]{8})$ ]]; then
            echo "::error::Invalid staging branch: $STAGING_REF"
            exit 1
          fi
          PR_NUMBER="${BASH_REMATCH[1]}"
          EXPECTED_MERGE_SHA="${BASH_REMATCH[2]}"
          MERGE_SHA=$(git rev-parse HEAD^)
          ACTUAL_MERGE_SHA="${MERGE_SHA:0:8}"
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          VERSION="$STAGING_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta-([1-9][0-9]*)$ ]]; then
            echo "::error::Invalid staging version: $VERSION"
            exit 1
          fi
          VERSION_PR="${BASH_REMATCH[1]}"
          if [[ "$ACTUAL_MERGE_SHA" != "$EXPECTED_MERGE_SHA" ]]; then
            echo "::error::Branch suffix does not match the tested merge commit: $ACTUAL_MERGE_SHA"
            exit 1
          fi
          if [[ "$VERSION_PR" != "$PR_NUMBER" ]]; then
            echo "::error::Version does not match PR #$PR_NUMBER: $VERSION"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::package.json version is $PACKAGE_VERSION, expected $VERSION"
            exit 1
          fi
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          if [[ "$CHANGED_FILES" != "apps/desktop/package.json" ]]; then
            echo "::error::Staging version commit changed unexpected files: $CHANGED_FILES"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: desktop
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build desktop
        run: pnpm --filter @adt/desktop build

      - name: Select latest Xcode
        if: matrix.os == 'macos-26'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package macOS
        if: matrix.os == 'macos-26'
        run: pnpm --filter @adt/desktop exec electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Acquire Azure code signing token
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "::error::Missing Azure credentials (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET)."
            exit 1
          fi
          TOKEN=$(curl -fsS -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${AZURE_CLIENT_ID}&client_secret=${AZURE_CLIENT_SECRET}&resource=https%3A%2F%2Fcodesigning.azure.net" \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/token" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain AZ_TOKEN from Azure OAuth endpoint."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "AZ_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set up Java
        if: matrix.os == 'windows-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache jsign.jar
        if: matrix.os == 'windows-latest'
        id: jsign-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/jsign.jar
          key: jsign-7.1

      - name: Download jsign.jar
        if: matrix.os == 'windows-latest' && steps.jsign-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o apps/desktop/jsign.jar \
            https://repo1.maven.org/maven2/net/jsign/jsign/7.1/jsign-7.1.jar

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @adt/desktop exec electron-builder --win --publish never

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @adt/desktop exec electron-builder --linux --publish never

      - name: Upload staging installers
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
