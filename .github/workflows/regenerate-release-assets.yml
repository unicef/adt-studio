name: Regenerate release assets
run-name: Regenerate ${{ inputs.release_tag }} — ${{ inputs.regenerate }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable draft, beta tag, or staging tag"
        required: true
        type: string
      regenerate:
        description: "What to regenerate"
        required: true
        default: both
        type: choice
        options:
          - both
          - notes
          - image
      hero_feature:
        description: "Main feature to emphasize (optional)"
        required: false
        type: string
      release_notice:
        description: "Exact first-line notice; blank preserves the current notice"
        required: false
        type: string
      cover_palette:
        description: "ADT + pipeline feature palette"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - random
          - adt
          - extract
          - sectioning
          - storyboard
          - captions
          - quizzes
          - glossary
          - toc
          - easy-read
          - sign-language
          - translate
          - speech
          - validation
          - preview
          - export

permissions:
  contents: read

concurrency:
  group: regenerate-release-assets-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      run_here: ${{ steps.route.outputs.run_here }}
    steps:
      - name: Route request to the trusted release branch
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ inputs.release_tag }}
          REGENERATE: ${{ inputs.regenerate }}
          HERO_FEATURE: ${{ inputs.hero_feature }}
          RELEASE_NOTICE: ${{ inputs.release_notice }}
          COVER_PALETTE: ${{ inputs.cover_palette }}
        run: |
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta-pr-([0-9]+)$ ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json state,baseRefName,isCrossRepository)
            if [[ "$(jq -r '.state' <<< "$PR_JSON")" != "OPEN" ]] \
              || [[ "$(jq -r '.baseRefName' <<< "$PR_JSON")" != "develop" ]] \
              || [[ "$(jq -r '.isCrossRepository' <<< "$PR_JSON")" != "false" ]]; then
              echo "::error::Staging regeneration requires an open same-repository PR into develop."
              exit 1
            fi
            echo "channel=staging" >> "$GITHUB_OUTPUT"
            echo "run_here=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            if [[ "$BRANCH" != "develop" ]]; then
              echo "::error::Published beta releases must be regenerated from develop."
              exit 1
            fi
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "run_here=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must be stable, numbered beta, or beta-pr staging version."
            exit 1
          fi

          echo "channel=stable" >> "$GITHUB_OUTPUT"
          if [[ "$BRANCH" == "main" ]]; then
            echo "run_here=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh workflow run regenerate-release-assets.yml --repo "$REPO" --ref main \
            -f "release_tag=$TAG" \
            -f "regenerate=$REGENERATE" \
            -f "hero_feature=$HERO_FEATURE" \
            -f "release_notice=$RELEASE_NOTICE" \
            -f "cover_palette=$COVER_PALETTE"
          echo "run_here=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Forwarded stable regeneration to main"
            echo "- Release: \`$TAG\`"
            echo "- Follow the main run: https://github.com/$REPO/actions/workflows/regenerate-release-assets.yml"
          } >> "$GITHUB_STEP_SUMMARY"

  regenerate:
    needs: route
    if: needs.route.outputs.run_here == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ needs.route.outputs.channel == 'stable' && 'release-ai' || 'release-ai-preview' }}
    permissions:
      contents: write
    steps:
      - name: Validate routed request
        env:
          TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          if [[ "$CHANNEL" == "stable" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Stable regeneration must execute on main."
            exit 1
          elif [[ "$CHANNEL" == "beta" && "$GITHUB_REF_NAME" != "develop" ]]; then
            echo "::error::Beta regeneration must execute on develop."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Run the generator from the trusted branch commit that dispatched
          # this workflow. The release tag remains the content target and may
          # predate fixes to the regeneration tooling.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          gh release view "$TAG" --repo "$REPO" \
            --json databaseId,url,isDraft,isPrerelease,body > draft.json
          IS_DRAFT=$(jq -r '.isDraft' draft.json)
          IS_PRERELEASE=$(jq -r '.isPrerelease' draft.json)
          if [[ "$CHANNEL" == "stable" ]]; then
            if [[ "$IS_DRAFT" != "true" || "$IS_PRERELEASE" != "false" ]]; then
              echo "::error::$TAG is not an unpublished stable draft."
              exit 1
            fi
          elif [[ "$IS_DRAFT" != "false" || "$IS_PRERELEASE" != "true" ]]; then
            echo "::error::$TAG is not a published prerelease."
            exit 1
          fi
          RELEASE_ID=$(jq -r '.databaseId' draft.json)
          jq -r '.body // ""' draft.json > current-release.md
          BODY_HASH=$(sha256sum current-release.md | awk '{print $1}')
          PREV_TAG=$(node scripts/resolve-previous-release-tag.mjs "$TAG")
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "body_hash=$BODY_HASH" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$(jq -r '.url' draft.json)" >> "$GITHUB_OUTPUT"

      - name: Compose factual base notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          PREV_TAG: ${{ steps.draft.outputs.prev_tag }}
        run: |
          ARGS=(
            -X POST "repos/$REPO/releases/generate-notes"
            -f "tag_name=$TAG"
            -f "target_commitish=$TAG"
          )
          [[ -n "$PREV_TAG" ]] && ARGS+=(-f "previous_tag_name=$PREV_TAG")
          gh api "${ARGS[@]}" --jq '.body' > release-notes-base.md
          test -s release-notes-base.md

      - name: Regenerate selected assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          PREV_TAG: ${{ steps.draft.outputs.prev_tag }}
          REGENERATE: ${{ inputs.regenerate }}
          HERO_FEATURE: ${{ inputs.hero_feature }}
          RELEASE_NOTICE: ${{ inputs.release_notice }}
          COVER_PALETTE: ${{ inputs.cover_palette }}
          COVER_NAME: release-cover-${{ github.run_id }}.png
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is not configured."
            exit 1
          fi
          COVER_URL="https://release-assets.invalid/$COVER_NAME"
          ARGS=(
            --from "$PREV_TAG"
            --to "$TAG"
            --tag "$TAG"
            --repo "$REPO"
            --hero "${HERO_FEATURE:-}"
            --notice "${RELEASE_NOTICE:-}"
            --palette "${COVER_PALETTE:-auto}"
            --regenerate "$REGENERATE"
            --cover-name "$COVER_NAME"
            --cover-url "$COVER_URL"
            --output regenerated-assets
          )
          ARGS+=(--base-notes-file release-notes-base.md)
          if [[ "$REGENERATE" != "both" ]] \
            || grep -q '<!-- adt-ai-notes:start -->' current-release.md \
            || ! cmp -s current-release.md release-notes-base.md; then
            ARGS+=(--existing-notes-file current-release.md)
          fi
          node scripts/generate-ai-release-assets.mjs "${ARGS[@]}"

      - name: Keep generation diagnostics with the workflow run
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-generation-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          path: regenerated-assets

      - name: Verify release did not change during generation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          EXPECTED_HASH: ${{ steps.draft.outputs.body_hash }}
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          gh api "repos/$REPO/releases/$RELEASE_ID" > draft-current.json
          IS_DRAFT=$(jq -r '.draft' draft-current.json)
          IS_PRERELEASE=$(jq -r '.prerelease' draft-current.json)
          if [[ "$CHANNEL" == "stable" && \
            ( "$IS_DRAFT" != "true" || "$IS_PRERELEASE" != "false" ) ]]; then
            echo "::error::The stable draft changed state while regeneration was running."
            exit 1
          elif [[ ( "$CHANNEL" == "beta" || "$CHANNEL" == "staging" ) && \
            ( "$IS_DRAFT" != "false" || "$IS_PRERELEASE" != "true" ) ]]; then
            echo "::error::The prerelease changed state while regeneration was running."
            exit 1
          fi
          jq -r '.body // ""' draft-current.json > body-current.md
          ACTUAL_HASH=$(sha256sum body-current.md | awk '{print $1}')
          if [[ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]]; then
            echo "::error::The release was edited while regeneration was running. Run regeneration again to avoid overwriting human edits."
            exit 1
          fi

      - name: Upload generated assets and update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          REGENERATE: ${{ inputs.regenerate }}
          COVER_NAME: release-cover-${{ github.run_id }}.png
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          COVERS_UPLOADED=false
          cleanup_uploaded_covers() {
            if [[ "$COVERS_UPLOADED" != "true" ]]; then
              return
            fi
            COVERS_UPLOADED=false
            COVER_PREFIX="${COVER_NAME%.png}-"
            gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r --arg prefix "$COVER_PREFIX" \
                '.[] | select(.name | startswith($prefix)) | .id' \
              | while read -r asset_id; do
                  gh api --method DELETE "repos/$REPO/releases/assets/$asset_id" || true
                done
          }
          trap cleanup_uploaded_covers ERR

          if [[ "$REGENERATE" == "image" || "$REGENERATE" == "both" ]]; then
            COVERS_UPLOADED=true
            for cover in regenerated-assets/release-cover-*.png; do
              [[ -e "$cover" ]] && gh release upload "$TAG" --repo "$REPO" --clobber \
                "$cover#Release cover"
            done
          fi
          # Recheck after uploading because publishing and manual edits do not
          # participate in this workflow's per-tag concurrency lock.
          gh api "repos/$REPO/releases/$RELEASE_ID" > draft-before-patch.json
          IS_DRAFT=$(jq -r '.draft' draft-before-patch.json)
          IS_PRERELEASE=$(jq -r '.prerelease' draft-before-patch.json)
          STATE_CHANGED=false
          if [[ "$CHANNEL" == "stable" && \
            ( "$IS_DRAFT" != "true" || "$IS_PRERELEASE" != "false" ) ]]; then
            STATE_CHANGED=true
          elif [[ ( "$CHANNEL" == "beta" || "$CHANNEL" == "staging" ) && \
            ( "$IS_DRAFT" != "false" || "$IS_PRERELEASE" != "true" ) ]]; then
            STATE_CHANGED=true
          fi
          if [[ "$STATE_CHANGED" == "true" ]]; then
            cleanup_uploaded_covers
            echo "::error::$TAG changed release state before the notes could be updated."
            exit 1
          fi
          jq -r '.body // ""' draft-before-patch.json > body-before-patch.md
          BEFORE_HASH=$(sha256sum body-before-patch.md | awk '{print $1}')
          EXPECTED_HASH=$(sha256sum body-current.md | awk '{print $1}')
          if [[ "$BEFORE_HASH" != "$EXPECTED_HASH" ]]; then
            cleanup_uploaded_covers
            echo "::error::The release changed before update; refusing to overwrite it."
            exit 1
          fi

          if [[ "$REGENERATE" == "image" || "$REGENERATE" == "both" ]]; then
            gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              > release-assets.json
            LIGHT_NAME="${COVER_NAME%.png}-light.png"
            DARK_NAME="${COVER_NAME%.png}-dark.png"
            LIGHT_URL=$(jq -r --arg name "$LIGHT_NAME" \
              '[.[] | select(.name == $name)] | if length == 1 then .[0].browser_download_url else empty end' \
              release-assets.json)
            DARK_URL=$(jq -r --arg name "$DARK_NAME" \
              '[.[] | select(.name == $name)] | if length == 1 then .[0].browser_download_url else empty end' \
              release-assets.json)
            if [[ -z "$LIGHT_URL" || -z "$DARK_URL" ]]; then
              echo "::error::Could not resolve the uploaded release cover URLs."
              exit 1
            fi
            LIGHT_URL="$LIGHT_URL" DARK_URL="$DARK_URL" node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { replaceReleaseCoverUrls } from "./scripts/generate-ai-release-assets.mjs";

          const filename = "regenerated-assets/release-notes.md";
          const body = await readFile(filename, "utf8");
          await writeFile(filename, replaceReleaseCoverUrls(body, {
            lightUrl: process.env.LIGHT_URL,
            darkUrl: process.env.DARK_URL,
          }));
          NODE
          fi

          jq -n --rawfile body regenerated-assets/release-notes.md '{body: $body}' \
            | gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" --input - >/dev/null
          # The body now references this cover pair. Keep it if a later metadata
          # upload fails; a rerun can safely replace the metadata.
          trap - ERR

          if [[ "$REGENERATE" == "notes" || "$REGENERATE" == "both" ]]; then
            gh release upload "$TAG" --repo "$REPO" --clobber \
              "regenerated-assets/release-i18n.json#Localized release metadata"
          fi

          LEGACY_AI_ASSETS='[
            "release-context.json",
            "release-editorial.json",
            "release-text-request.json",
            "release-translation-request.json",
            "release-image-prompt-light.txt",
            "release-image-prompt-dark.txt"
          ]'
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
            | jq -r --argjson legacy "$LEGACY_AI_ASSETS" \
              '.[] | select(.name as $name | $legacy | index($name)) | .id' \
            | while read -r asset_id; do
                gh api --method DELETE "repos/$REPO/releases/assets/$asset_id"
              done

          if [[ "$REGENERATE" == "image" || "$REGENERATE" == "both" ]]; then
            COVER_PREFIX="${COVER_NAME%.png}-"
            gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r --arg prefix "$COVER_PREFIX" \
                '.[] | select((.name | startswith("release-cover-")) and ((.name | startswith($prefix)) | not)) | .id' \
              | while read -r asset_id; do
                  gh api --method DELETE "repos/$REPO/releases/assets/$asset_id"
                done
          fi

      - name: Add review links
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          REGENERATE: ${{ inputs.regenerate }}
          COVER_PALETTE: ${{ inputs.cover_palette }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
          CHANNEL: ${{ needs.route.outputs.channel }}
        run: |
          {
            echo "### Release assets regenerated"
            echo "- Updated: \`$REGENERATE\`"
            echo "- Cover palette: \`${COVER_PALETTE:-auto}\`"
            if [[ "$CHANNEL" == "beta" || "$CHANNEL" == "staging" ]]; then
              echo "- Review published $CHANNEL release: $RELEASE_URL"
              echo "- The regenerated $CHANNEL notes and covers are already live."
            else
              echo "- Review stable draft: $RELEASE_URL"
              echo "- When satisfied, use GitHub's **Publish release** button."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
