name: Create PR Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  create-staging:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.pull_requests[0].number != null
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested merge metadata
        uses: actions/download-artifact@v4
        with:
          name: staging-metadata
          path: staging-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve tested pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          TESTED_BASE: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          for ATTEMPT in {1..5}; do
            PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            MERGEABLE=$(jq -r '.mergeable' <<< "$PR")
            [[ "$MERGEABLE" != "null" ]] && break
            echo "Waiting for GitHub to calculate mergeability (attempt $ATTEMPT/5)."
            sleep 2
          done
          BASE_REF=$(jq -r '.base.ref' <<< "$PR")
          BASE_SHA=$(jq -r '.base.sha' <<< "$PR")
          HEAD_REF=$(jq -r '.head.ref' <<< "$PR")
          HEAD_SHA=$(jq -r '.head.sha' <<< "$PR")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PR")
          DRAFT=$(jq -r '.draft' <<< "$PR")
          HAS_STAGING_LABEL=$(jq -r 'any(.labels[]; .name == "staging")' <<< "$PR")
          MERGE_SHA=$(tr -d '\r\n' < staging-metadata/staging-merge-sha.txt)

          if [[ "$BASE_REF" != "develop" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" || "$DRAFT" == "true" ]]; then
            echo "PR #$PR_NUMBER is not eligible for staging."
            exit 0
          fi
          if [[ "$HAS_STAGING_LABEL" != "true" ]]; then
            echo "PR #$PR_NUMBER has no 'staging' label; add the label and re-run CI to build staging."
            exit 0
          fi
          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid tested merge SHA."
            exit 1
          fi

          TRANSLATIONS_ONLY=false
          if [[ "$HEAD_SHA" != "$TESTED_HEAD" && "$BASE_SHA" == "$TESTED_BASE" ]]; then
            if git fetch origin "$TESTED_HEAD" "$HEAD_SHA"; then
              DELTA=$(git diff --name-only "$TESTED_HEAD" "$HEAD_SHA")
              if [[ -z "$DELTA" ]] || ! grep -qv '^apps/studio/src/locales/' <<< "$DELTA"; then
                TRANSLATIONS_ONLY=true
                echo "PR #$PR_NUMBER head only gained translation catalog commits; continuing with the current head."
              fi
            fi
          fi
          if [[ ( "$HEAD_SHA" != "$TESTED_HEAD" || "$BASE_SHA" != "$TESTED_BASE" ) && "$TRANSLATIONS_ONLY" != "true" ]]; then
            echo "PR #$PR_NUMBER changed after this CI run; a current successful run is required."
            exit 0
          fi
          if [[ "$MERGEABLE" == "null" ]]; then
            echo "::error::GitHub did not report mergeability for PR #$PR_NUMBER in time. Re-run this workflow."
            exit 1
          fi
          if [[ "$MERGEABLE" != "true" ]]; then
            echo "PR #$PR_NUMBER is not currently mergeable."
            exit 0
          fi

          git fetch origin "pull/$PR_NUMBER/merge"
          CURRENT_MERGE_SHA=$(git rev-parse FETCH_HEAD)
          if [[ "$TRANSLATIONS_ONLY" == "true" ]]; then
            if [[ "$(git rev-parse "$CURRENT_MERGE_SHA^2")" != "$HEAD_SHA" ]]; then
              echo "PR #$PR_NUMBER merge ref does not match its head commit."
              exit 0
            fi
            MERGE_SHA="$CURRENT_MERGE_SHA"
          elif [[ "$CURRENT_MERGE_SHA" != "$MERGE_SHA" ]]; then
            echo "PR #$PR_NUMBER merge commit changed after this CI run."
            exit 0
          fi
          SHORT_SHA="${MERGE_SHA:0:8}"
          STAGING_BRANCH="staging/pr-${PR_NUMBER}-${SHORT_SHA}"
          VERSION=$(node scripts/calculate-release-version.mjs staging "$PR_NUMBER")

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$STAGING_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create staging branch
        id: stage
        if: steps.pr.outputs.branch != ''
        env:
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          STAGING_BRANCH: ${{ steps.pr.outputs.branch }}
          VERSION: ${{ steps.pr.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$STAGING_BRANCH" >/dev/null 2>&1; then
            echo "Staging branch $STAGING_BRANCH already exists."
            git fetch origin "refs/heads/$STAGING_BRANCH"
            git checkout --detach FETCH_HEAD
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta-${PR_NUMBER}$ ]]; then
              echo "::error::Existing staging branch has an invalid package version: $VERSION"
              exit 1
            fi
          else
            git checkout --detach "$MERGE_SHA"
            (
              cd apps/desktop
              npm version "$VERSION" --no-git-tag-version --ignore-scripts
            )
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/package.json
            git commit -m "chore(staging): set PR #${PR_NUMBER} version to ${VERSION}"
            git push origin "HEAD:refs/heads/$STAGING_BRANCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch staging build
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGING_BRANCH: ${{ steps.pr.outputs.branch }}
          STAGING_VERSION: ${{ steps.stage.outputs.version }}
        run: |
          gh workflow run staging-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f staging_ref="$STAGING_BRANCH" \
            -f staging_version="$STAGING_VERSION"

      - name: Add staging summary
        if: steps.pr.outputs.branch != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          STAGING_BRANCH: ${{ steps.pr.outputs.branch }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          {
            echo "### Staging ready for PR #$PR_NUMBER"
            echo "- Source: \`$HEAD_REF\`"
            echo "- Branch: \`$STAGING_BRANCH\`"
            echo "- Version: \`$VERSION\`"
            echo "- A separate **Staging Build** workflow was queued."
          } >> "$GITHUB_STEP_SUMMARY"
