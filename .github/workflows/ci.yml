# Type-checks and tests the bot on every PR into backlog-wizard.
name: Backlog Wizard CI

on:
  pull_request:
    branches: [backlog-wizard]
  push:
    branches: [backlog-wizard]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
