name: Staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.stage.outputs.slug }}
      branch: ${{ steps.stage.outputs.branch }}
      version: ${{ steps.stage.outputs.version }}
      commit: ${{ steps.stage.outputs.commit }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge with develop and create staging branch
        id: stage
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_NAME" == "develop" || "$REF_NAME" == "main" || "$REF_NAME" == staging/* ]]; then
            echo "::error::Staging cannot run from '$REF_NAME'. Select a feature or fix branch."
            exit 1
          fi

          SLUG=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//')
          if [[ -z "$SLUG" ]]; then
            echo "::error::Branch '$REF_NAME' produced an empty staging slug."
            exit 1
          fi
          STAGING_BRANCH="staging/$SLUG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout --detach origin/develop
          if ! git merge --no-edit "$SOURCE_SHA"; then
            git merge --abort || true
            echo "::error::Branch '$REF_NAME' has conflicts with develop; resolve them before staging."
            exit 1
          fi

          VERSION=$(node scripts/calculate-release-version.mjs staging "$SLUG")
          (
            cd apps/desktop
            npm version "$VERSION" --no-git-tag-version --ignore-scripts
          )
          git add apps/desktop/package.json
          git commit -m "chore(staging): set '$SLUG' version to $VERSION"
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$STAGING_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add staging summary
        env:
          REF_NAME: ${{ github.ref_name }}
          STAGING_BRANCH: ${{ steps.stage.outputs.branch }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          {
            echo "### Staging ready for \`$REF_NAME\`"
            echo "- Branch: \`$STAGING_BRANCH\`"
            echo "- Version: \`$VERSION\`"
            echo "- Built from \`$REF_NAME\` merged with \`develop\`."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: desktop
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.stage.outputs.version }}
      SKIP_NOTARIZE: ${{ vars.SKIP_NOTARIZE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build desktop
        run: pnpm --filter @adt/desktop build

      - name: Select latest Xcode
        if: matrix.os == 'macos-26'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package macOS
        if: matrix.os == 'macos-26'
        run: pnpm --filter @adt/desktop exec electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Acquire Azure code signing token
        if: matrix.os == 'windows-latest' && env.SKIP_NOTARIZE != 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "::error::Missing Azure credentials (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET)."
            exit 1
          fi
          TOKEN=$(curl -fsS -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${AZURE_CLIENT_ID}&client_secret=${AZURE_CLIENT_SECRET}&resource=https%3A%2F%2Fcodesigning.azure.net" \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/token" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain AZ_TOKEN from Azure OAuth endpoint."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "AZ_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set up Java
        if: matrix.os == 'windows-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache jsign.jar
        if: matrix.os == 'windows-latest'
        id: jsign-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/jsign.jar
          key: jsign-7.1

      - name: Download jsign.jar
        if: matrix.os == 'windows-latest' && steps.jsign-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o apps/desktop/jsign.jar \
            https://repo1.maven.org/maven2/net/jsign/jsign/7.1/jsign-7.1.jar

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @adt/desktop exec electron-builder --win --publish never

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @adt/desktop exec electron-builder --linux --publish never

      - name: Upload staging installers
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ needs.stage.outputs.version }}-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/beta*.yml

  publish:
    needs: [stage, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.commit }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download staging installers
        uses: actions/download-artifact@v4
        with:
          pattern: staging-*
          path: dist
          merge-multiple: true

      - name: Compose staging release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.stage.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ needs.stage.outputs.commit }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rm -f release-notes.tmp release-notes.md
          if node scripts/compose-release-notes.mjs > release-notes.tmp && [ -s release-notes.tmp ]; then
            mv release-notes.tmp release-notes.md
          else
            rm -f release-notes.tmp release-notes.md
            echo "::warning::Could not compose staging release notes; gh will generate them."
          fi

      - name: Publish staging pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.stage.outputs.version }}
          SLUG: ${{ needs.stage.outputs.slug }}
          TARGET: ${{ needs.stage.outputs.commit }}
        run: |
          EXISTING=$(gh release list --repo "$REPO" --limit 200 --json tagName \
            --jq '.[].tagName' | { grep -E -- "-beta-${SLUG}$" || true; })
          for release in $EXISTING; do
            gh release delete "$release" --repo "$REPO" --yes --cleanup-tag
          done

          NOTES_ARGS=(--generate-notes)
          if [ -s release-notes.md ]; then
            NOTES_ARGS=(--notes-file release-notes.md)
          fi
          gh release create "$TAG" --repo "$REPO" \
            --target "$TARGET" \
            --title "ADT Studio $TAG" \
            --prerelease \
            "${NOTES_ARGS[@]}" \
            dist/*
