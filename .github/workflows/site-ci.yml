name: Site CI

# Checks for the unified site (landing page + docs) in apps/site. Work happens
# on landing-page-v1; it is merged into the standalone landing-page branch (the
# deploy branch) when ready. Runs on landing-page-v1 pushes and on PRs into
# landing-page. Never merged into main.

on:
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [landing-page-v1]
    paths:
      - "apps/site/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for unextracted UI strings
        run: |
          pnpm --filter @adt/site extract
          NEW=$(git diff -- apps/site/src/locales/ | grep '^+msgid "' | grep -v '^+msgid ""' || true)
          if [ -n "$NEW" ]; then
            echo "New unextracted strings found. Run 'pnpm --filter @adt/site extract' and commit the updated .po files."
            echo "$NEW"
            exit 1
          fi
      - name: Check translations are complete
        # Blocks the PR when translations are not fully done: any empty msgstr
        # in a target-locale .po, any untranslated docs page, or any placeholder
        # stub. Also fails on structural errors (orphans, missing title, unknown
        # locale folder). Drop --strict to only report coverage.
        run: node apps/site/scripts/check-translations.mjs --strict
      # Build first: the Vite plugin generates src/routeTree.gen.ts (gitignored)
      # which the type-check needs — there's no standalone generator for it.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @adt/site build
      - name: Typecheck
        run: pnpm --filter @adt/site run types:check
