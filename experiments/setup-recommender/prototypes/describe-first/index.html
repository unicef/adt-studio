<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell Us First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --line:#e2ddd2; --ink:#1d1b17; --ink-2:#5b574e; --ink-3:#8a857a;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#dcebe8;
  --flag:#a15c00; --flag-soft:#fbefd9; --flag-line:#e8c27a;
  --lock:#3d3a7a; --lock-soft:#e9e8f6; --lock-line:#b9b6e3;
  --ok:#2c6e3f; --ok-soft:#e0f0e4; --changed:#fff2b8;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --surface:#1f1d18; --surface-2:#29261f; --line:#37332a; --ink:#f2efe7; --ink-2:#bdb7aa; --ink-3:#8b8577;
    --accent:#6cc2b9; --accent-ink:#0d1f1d; --accent-soft:#1d3532;
    --flag:#f2b555; --flag-soft:#3a2c13; --flag-line:#7a5a22;
    --lock:#b3afff; --lock-soft:#25233f; --lock-line:#4a4785;
    --ok:#7fd196; --ok-soft:#1b3322; --changed:#4a3f10;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1f1d18; --surface-2:#29261f; --line:#37332a; --ink:#f2efe7; --ink-2:#bdb7aa; --ink-3:#8b8577;
  --accent:#6cc2b9; --accent-ink:#0d1f1d; --accent-soft:#1d3532;
  --flag:#f2b555; --flag-soft:#3a2c13; --flag-line:#7a5a22;
  --lock:#b3afff; --lock-soft:#25233f; --lock-line:#4a4785;
  --ok:#7fd196; --ok-soft:#1b3322; --changed:#4a3f10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Figtree",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:24px;line-height:1.2} h2{font-size:19px;line-height:1.25} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .wrapflex{flex-wrap:wrap}
.stack>*+*{margin-top:12px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:600;font-size:14px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.books{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.bookbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;white-space:nowrap;font-size:13px}
.bookbtn img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.bookbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bookbtn .wrongdot{width:6px;height:6px;border-radius:50%;background:var(--flag)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}

/* buttons, chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .ai{font-size:11px;opacity:.75;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.lock{background:var(--lock-soft);color:var(--lock)}
.badge.flag{background:var(--flag-soft);color:var(--flag)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.later{background:var(--surface-2);color:var(--ink-2)}
.badge svg{width:12px;height:12px}

/* locked zone */
.locked{border:1.5px solid var(--lock-line);border-radius:var(--radius);background:
  repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--lock-soft) 60%,transparent) 10px 11px),var(--surface)}
.locked-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--lock-line);color:var(--lock)}
.locked-head p{color:var(--ink-2)}

/* page thumbs */
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);padding:0}
.thumb img{height:84px;width:auto}
.thumb .pn{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
.thumb.cited{outline:2px solid var(--accent);outline-offset:-2px}
.spreadpair{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.spreadpair img{height:84px;width:auto}
.spreadpair img+img{border-left:1px dashed var(--ink-3)}

/* settings list */
.setting{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting .name{font-size:13px;color:var(--ink-2)}
.setting .val{font-weight:600}
.setting .was{font-size:12px;color:var(--ink-3);text-decoration:line-through;margin-left:6px;font-weight:400}
.setting .why{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
.setting.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--changed)}100%{background:transparent}}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(10,10,8,.8);display:none;place-items:center;z-index:50;padding:16px}
.lightbox.open{display:grid}
.lightbox img{max-height:86vh;max-width:100%;border-radius:8px;background:#fff}
.lightbox .cap{color:#fff;text-align:center;margin-top:8px;font-size:14px}

.note{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:10px;margin-top:24px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

main{padding-top:24px;padding-bottom:80px}
.hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;align-items:start;max-width:900px;margin:0 auto}
@media (max-width:640px){.hero{grid-template-columns:1fr;gap:16px}.hero .cover{max-width:140px}}
.cover img{border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow)}
.status{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:8px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
@media (max-width:640px){.kinds{grid-template-columns:1fr}}
.kind{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.kind{flex-direction:row;align-items:center}.kind .mini{width:54px;flex:none}}
.kind b{font-size:16px}
.kind span{font-size:12px;color:var(--ink-2)}
.kind:hover{border-color:var(--ink-3)}
.mini{aspect-ratio:4/3;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mini .ln{height:4px;border-radius:2px;background:var(--ink-3);opacity:.5}
.mini .pic{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2));border-radius:3px;flex:1}
.mini .box{width:8px;height:8px;border:1.5px solid var(--ink-3);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:3px}
.say{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.say input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.result{max-width:900px;margin:0 auto}
.youSaid{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.callout{border-radius:var(--radius);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.callout.flag{background:var(--flag-soft);color:var(--ink)}
.callout.flag svg{color:var(--flag);flex:none;width:18px;height:18px;margin-top:2px}
.callout.ok{background:var(--ok-soft)}
.callout.ok svg{color:var(--ok);flex:none;width:18px;height:18px;margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.factrow{padding:12px 16px;border-top:1px solid var(--line)}
.factrow:first-child{border-top:0}
.factrow .q{font-size:13px;color:var(--ink-2)}
.group{padding:4px 16px 8px}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;gap:8px}
.lockitem{padding:10px 16px;border-top:1px solid var(--lock-line)}
.lockitem:first-of-type{border-top:0}
</style>
</head>

/* port of rules.ts decide() — same facts, same settings */
function decide(d, s) {
  const preset = { story: "storybook", textbook: "textbook", reference: "reference" }[s.genre]
  const pageGrouping = d.pageStorage.value === "spreads-as-separate-pages"
    ? { value: "spread", rule: "Facing pages continue across the fold, so each pair is joined into one screen." }
    : { value: "single", rule: d.pageStorage.value === "spreads-as-wide-pages" ? "Spreads are already stored as one wide page." : "Pages stand alone." }
  const hasText = d.textLayer.value === "digital"
  let renderStrategy
  if (preset === "reference") renderStrategy = { value: "single_column", rule: "Reference material reads best as one clean column." }
  else if (preset === "textbook") renderStrategy = { value: "llm", rule: "Lessons and exercises need the AI layout to rebuild their structure." }
  else if (s.composition === "text-in-art") renderStrategy = hasText ? { value: "fixed_layout", rule: "Text is placed on the pictures, so the original page design is kept." } : { value: "llm-overlay", rule: "Text is on the pictures but the PDF has no real text, so the AI rebuilds it over the art." }
  else if (s.composition === "text-beside-art") renderStrategy = { value: "two_column_story", rule: "Text sits beside the pictures, so story text and art go side by side." }
  else renderStrategy = { value: "llm", rule: "Mostly text, so the AI layout reflows it." }
  const ex = s.exercises !== "none"
  const activitiesGenerator = preset === "textbook" && ex ? { value: "enabled", rule: "The book has exercises, so they become interactive activities." } : { value: "disabled", rule: ex ? "Activities are only made in the Textbook preset." : "No exercises for the reader." }
  const sectioningMode = preset === "textbook" && ex && renderStrategy.value !== "fixed_layout" ? { value: "dynamic", rule: "Pages mix reading and exercises, so each page is split into parts." } : { value: "page", rule: "Each page is one unit." }
  const figureExtraction = hasText && (s.diagrams !== "none" || d.vectorDiagrams.value) ? { value: "auto", rule: "Diagrams with text labels are kept together as figures." } : { value: "off", rule: hasText ? "No labelled diagrams." : "Without real text there are no labels to group." }
  return { preset: { value: preset, rule: `The book is ${s.genre === "reference" ? "reference material" : "a " + s.genre}.` }, renderStrategy, pageGrouping, sectioningMode, activitiesGenerator, figureExtraction }
}

const langName = (c) => ({ es: "Spanish", en: "English", pt: "Portuguese" })[c] || c

/* Where reading A (one call, whole book) and reading B (page-by-page labels) disagree.
   matters = picking one or the other changes at least one setting. */
function disagreements(b) {
  const A = aiFacts(b), Bs = b.readingB.semantic
  return FACT_ORDER.filter((k) => A[k] !== Bs[k]).map((k) => {
    const sa = decide(b.measured, A), sb = decide(b.measured, { ...A, [k]: Bs[k] })
    const changes = SETTING_ORDER.filter((s) => sa[s].value !== sb[s].value)
    return { fact: k, a: A[k], b: Bs[k], changes, matters: changes.length > 0 }
  })
}

/* What the page-by-page reading saw, as a short sentence */
function readingBSummary(b) {
  const c = {}
  for (const p of b.readingB.pages) c[p.type] = (c[p.type] || 0) + 1
  const names = { cover: "cover", "front-matter": "front matter", "back-matter": "back matter", blank: "blank", story: "story", lesson: "lesson", exercise: "exercise", informational: "information" }
  return Object.entries(c).map(([t, n]) => `${n} ${names[t] || t}`).join(" · ")
}

function spreadPairs(b) {
  const e = b.measured.pageStorage.evidence || []
  const out = []
  for (let i = 0; i + 1 < e.length; i += 2) out.push([e[i], e[i + 1]].sort((x, y) => x - y))
  return out.sort((x, y) => x[0] - y[0])
}

function measuredLine(b) {
  const m = b.measured
  return `${b.pageCount} pages · ${langName(m.language.guess)} · ${m.textLayer.value === "digital" ? "real text" : "scanned"}`
}

/* evidence for a locked setting, as HTML */
function lockedEvidence(b, key, sem) {
  const m = b.measured
  if (key === "pageGrouping") {
    const pairs = spreadPairs(b)
    if (m.pageStorage.value === "spreads-as-separate-pages")
      return { text: `Measured: ${m.pageStorage.detail.replace("gutter", "fold")}.`, html: `<div class="row wrapflex">${pairs.slice(0, 2).map(([x, y]) => `<button class="spreadpair" data-zoom="${x}"><img src="${img(b, x)}" alt="Page ${x}"><img src="${img(b, y)}" alt="Page ${y}"></button>`).join("")}</div>` }
    if (m.pageStorage.value === "spreads-as-wide-pages")
      return { text: `Measured: every page is landscape, so each page already holds a full spread.`, html: thumbs(b, [2, 3]) }
    return { text: `Measured: ${m.pageStorage.detail.replace("gutter", "fold")}. Each page stands alone.`, html: thumbs(b, [2, 3]) }
  }
  if (key === "figureExtraction") {
    const v = m.vectorDiagrams
    const t = sem.diagrams === "none" && !v.value ? `No labelled diagrams found.` : `Labelled figures: the AI says “${FACTS.diagrams.opts[sem.diagrams][0].toLowerCase()}”, the PDF has drawn diagrams on ${v.pagesWithDiagrams} page${v.pagesWithDiagrams === 1 ? "" : "s"}.`
    const pages = (b.readingA.diagrams.evidencePages || []).slice(0, 3)
    return { text: t, html: sem.diagrams !== "none" ? thumbs(b, pages) : "" }
  }
  return { text: "", html: "" }
}

function thumbs(b, pages, cited = []) {
  return `<div class="thumbs">${pages.map((p) => `<button class="thumb ${cited.includes(p) ? "cited" : ""}" data-zoom="${p}" aria-label="Open page ${p}"><img src="${img(b, p)}" alt="" loading="lazy"><span class="pn">p${p}</span></button>`).join("")}</div>`
}

      <div>
        <div class="locked"><div class="locked-head">${ICON.lock.replace("<svg", '<svg width="18" height="18"')}<div><h3>Fixed at import</h3><p class="tiny">Measured from the PDF. Changing these later means importing again.</p></div></div>
          ${LOCKED.map((k) => { const ev = lockedEvidence(book, k, facts); return `<div class="lockitem setting ${fl(k)}" style="display:block"><div class="small muted">${SETTINGS[k].name}</div><div style="font-weight:600">${SETTINGS[k].vals[s[k].value]}${was(k)}</div><p class="tiny muted" style="margin:4px 0 6px">${esc(ev.text)}</p>${ev.html}</div>` }).join("")}
        </div>
        <div class="card" style="margin-top:14px"><div class="ghead"><h3>Can change later</h3>${laterBadge()}</div><div class="group">
          ${CHEAP.map((k) => `<div class="setting ${fl(k)}"><span class="name">${SETTINGS[k].name}</span><span></span><span class="val">${SETTINGS[k].vals[s[k].value]}${was(k)}</span><span></span><span class="why">${esc(s[k].rule)}</span></div>`).join("")}
        </div></div>
        <button class="btn primary" id="create" style="width:100%;margin-top:14px" ${kind === "unsure" && flaggedGenre && !facts._confirmed ? "disabled" : ""}>Create book</button>
      </div>
    </div>
    <p class="note">Prototype. Real answers, reasons and cited pages from ${esc(DATA.source)}. In the real E8 variant the AI answers the other questions after the user's pick; here we reuse its unprompted answers.</p>
  </div>`
}

function render() {
  renderBookTabs(book.id, pick)
  kind ? step2() : step1()
  flashFrom = null
}

document.addEventListener("click", (e) => {
  const k = e.target.closest("[data-kind]")
  if (k) { line = ($("#line") || {}).value || ""; kind = k.dataset.kind; facts = null; render(); scrollTo(0, 0); return }
  const o = e.target.closest("[data-fact] [data-v]")
  if (o) {
    flashFrom = decide(book.measured, facts)
    const f = o.closest("[data-fact]").dataset.fact
    facts[f] = o.dataset.v
    if (f === "genre") facts._confirmed = true
    render(); return
  }
  if (e.target.id === "back") { kind = null; facts = null; render(); return }
  if (e.target.id === "create") e.target.outerHTML = `<p class="badge ok" style="margin-top:14px">${ICON.check}Created (prototype)</p>`
})

function pick(id) { book = bookById(id); kind = null; facts = null; setParam("book", id); render() }

setupTheme()
setupLightbox(() => book)
render()
</script>
</body>
</html>
