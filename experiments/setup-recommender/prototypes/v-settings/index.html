<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --line:#e2ddd2; --ink:#1d1b17; --ink-2:#5b574e; --ink-3:#8a857a;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#dcebe8;
  --flag:#a15c00; --flag-soft:#fbefd9; --flag-line:#e8c27a;
  --lock:#3d3a7a; --lock-soft:#e9e8f6; --lock-line:#b9b6e3;
  --ok:#2c6e3f; --ok-soft:#e0f0e4; --changed:#fff2b8;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --surface:#1f1d18; --surface-2:#29261f; --line:#37332a; --ink:#f2efe7; --ink-2:#bdb7aa; --ink-3:#8b8577;
    --accent:#6cc2b9; --accent-ink:#0d1f1d; --accent-soft:#1d3532;
    --flag:#f2b555; --flag-soft:#3a2c13; --flag-line:#7a5a22;
    --lock:#b3afff; --lock-soft:#25233f; --lock-line:#4a4785;
    --ok:#7fd196; --ok-soft:#1b3322; --changed:#4a3f10;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1f1d18; --surface-2:#29261f; --line:#37332a; --ink:#f2efe7; --ink-2:#bdb7aa; --ink-3:#8b8577;
  --accent:#6cc2b9; --accent-ink:#0d1f1d; --accent-soft:#1d3532;
  --flag:#f2b555; --flag-soft:#3a2c13; --flag-line:#7a5a22;
  --lock:#b3afff; --lock-soft:#25233f; --lock-line:#4a4785;
  --ok:#7fd196; --ok-soft:#1b3322; --changed:#4a3f10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Figtree",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:24px;line-height:1.2} h2{font-size:19px;line-height:1.25} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .wrapflex{flex-wrap:wrap}
.stack>*+*{margin-top:12px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:600;font-size:14px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.books{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.bookbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;white-space:nowrap;font-size:13px}
.bookbtn img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.bookbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bookbtn .wrongdot{width:6px;height:6px;border-radius:50%;background:var(--flag)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}

/* buttons, chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .ai{font-size:11px;opacity:.75;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.lock{background:var(--lock-soft);color:var(--lock)}
.badge.flag{background:var(--flag-soft);color:var(--flag)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.later{background:var(--surface-2);color:var(--ink-2)}
.badge svg{width:12px;height:12px}

/* locked zone */
.locked{border:1.5px solid var(--lock-line);border-radius:var(--radius);background:
  repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--lock-soft) 60%,transparent) 10px 11px),var(--surface)}
.locked-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--lock-line);color:var(--lock)}
.locked-head p{color:var(--ink-2)}

/* page thumbs */
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);padding:0}
.thumb img{height:84px;width:auto}
.thumb .pn{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
.thumb.cited{outline:2px solid var(--accent);outline-offset:-2px}
.spreadpair{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.spreadpair img{height:84px;width:auto}
.spreadpair img+img{border-left:1px dashed var(--ink-3)}

/* settings list */
.setting{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting .name{font-size:13px;color:var(--ink-2)}
.setting .val{font-weight:600}
.setting .was{font-size:12px;color:var(--ink-3);text-decoration:line-through;margin-left:6px;font-weight:400}
.setting .why{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
.setting.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--changed)}100%{background:transparent}}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(10,10,8,.8);display:none;place-items:center;z-index:50;padding:16px}
.lightbox.open{display:grid}
.lightbox img{max-height:86vh;max-width:100%;border-radius:8px;background:#fff}
.lightbox .cap{color:#fff;text-align:center;margin-top:8px;font-size:14px}

.note{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:10px;margin-top:24px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.flows{display:flex;gap:4px;flex-wrap:wrap;padding:8px 0 0}
.flows a{font-size:13px;text-decoration:none;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.flows a[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding-top:20px;padding-bottom:32px}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.bookhead{display:flex;gap:14px;align-items:center}
.bookhead img{width:56px;border-radius:6px;border:1px solid var(--line);flex:none}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-top:16px;font-size:15px}
.status svg{width:18px;height:18px;flex:none;margin-top:2px}
.status.calm{background:var(--ok-soft);color:var(--ok)}
.status.unsure{background:var(--flag-soft);color:var(--flag)}
.status p{color:var(--ink)}
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sec-h h2{font-size:17px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip figure{margin:0;flex:none;width:58px;text-align:center}
.strip button{padding:0;border:0;background:none;display:block;width:100%}
.strip img{width:58px;height:80px;object-fit:cover;object-position:top;border-radius:5px;border:1px solid var(--line);background:#fff}
.strip figcaption{font-size:11px;line-height:1.2;color:var(--ink-2);margin-top:3px}
.strip figure.front figcaption{color:var(--flag);font-weight:600}
.strip figure.off img{opacity:.25;filter:grayscale(1)}
.strip figure.off figcaption{text-decoration:line-through}
.strip .gap{flex:none;align-self:center;color:var(--ink-3);font-size:12px;padding:0 2px 16px}
.pagebar{display:flex;gap:1px;height:10px;margin-top:6px;border-radius:3px;overflow:hidden}
.pagebar i{flex:1;background:var(--surface-2)}
.pagebar i.read{background:var(--accent)}
.pagebar i.read.front{background:var(--flag)}
.facts{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.fact{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;align-items:center}
.fact:first-child{border-top:0}
.fact .sk{grid-row:span 2;width:52px;height:38px;color:var(--ink-2)}
.fact .q{font-size:13px;color:var(--ink-2)}
.fact .a{font-weight:600}
.fact .a .you{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px}
.fact .src{grid-column:2/-1;font-size:12px;color:var(--ink-3)}
.fact .chg{font-size:13px;color:var(--accent);background:none;border:0;padding:4px 0}
.fact .pick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fact .note{grid-column:1/-1;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 8px;margin-top:4px}
.fact.guess .src{color:var(--flag)}
.qcard{border:1.5px solid var(--flag-line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.qcard.calm{border-color:var(--line)}
.qcard.lockq{border-color:var(--lock-line)}
.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 16px;background:var(--flag-soft);font-size:13px;color:var(--flag);font-weight:600;flex-wrap:wrap}
.qcard.calm .qtop{background:var(--surface-2);color:var(--ink-2)}
.qcard.lockq .qtop{background:var(--lock-soft);color:var(--lock)}
.qbody{padding:16px}
.qbody h2{font-size:21px;margin:12px 0 4px}
.why{font-size:14px;color:var(--ink-2)}
.why b{color:var(--ink)}
.teach{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.help{font-size:13px;color:var(--ink-2);margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt:hover{border-color:var(--ink-3)}
.opt .sk{width:64px;height:46px;color:var(--ink-2)}
.opt b{font-size:15px}
.opt .d{font-size:12px;color:var(--ink-2)}
.opt .eff{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:6px;margin-top:auto;display:flex;flex-direction:column;gap:3px}
.opt .eff span b{font-size:12px;color:var(--ink)}
.opt .eff svg{width:11px;height:11px;vertical-align:-1px;color:var(--lock)}
.opt .tag{align-self:flex-start;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .mini{display:flex;justify-content:flex-start}
.qfoot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--flag)}
.dots i.done{background:var(--accent)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.vs>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vs .k{font-size:12px;color:var(--ink-3)}
.panel{align-self:start;position:sticky;top:96px}
@media (max-width:880px){.panel{position:static}}
.lockitem{padding:12px 16px;border-top:1px solid var(--lock-line)}
.lockitem:first-of-type{border-top:0}
.lockitem .k{font-size:13px;color:var(--ink-2)}
.lockitem .v{font-weight:600}
.lockitem .v.pending{color:var(--flag)}
.lockitem .ev{font-size:12px;color:var(--ink-2);margin-top:4px}
.lnk{font-size:12px;color:var(--lock);background:none;border:0;padding:0;margin-top:4px;text-decoration:underline}
.lnk.acc{color:var(--accent);font-size:13px}
.later{padding:4px 16px 12px}
.preview{margin:10px 0 4px;display:flex;gap:12px;align-items:center}
.device{flex:none;width:118px;height:160px;border:2px solid var(--ink-3);border-radius:12px;background:#fff;padding:7px;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.device.wide{width:190px;height:140px}
.device.sm{width:74px;height:100px;padding:5px;gap:3px;border-radius:9px}
.device.sm.wide{width:120px;height:86px}
.device img{width:100%;border-radius:3px}
.device .ln{height:4px;border-radius:2px;background:#8a857a;opacity:.6;flex:none}
.device.sm .ln{height:3px}
.device .hd{height:7px;width:70%;border-radius:2px;background:#5b574e;flex:none}
.device .two{display:flex;gap:6px;flex:1;min-height:0}
.device .two img{width:50%;height:100%;object-fit:cover}
.device .two div{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:center}
.device .fit{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.device .fit img{max-height:100%;width:auto;max-width:100%;object-fit:contain}
.device .pic{height:40px;object-fit:cover;flex:none}
.device .ph{height:34px;border-radius:3px;background:#d9d4c8;flex:none}
.device .box{border:1px solid #c9c3b6;border-radius:4px;padding:3px;display:flex;flex-direction:column;gap:3px;flex:none}
.device .col{padding:0 10%;display:flex;flex-direction:column;gap:4px}
.device .cap{height:3px;width:50%;background:#b5afa3;border-radius:2px;margin:0 auto;flex:none}
.preview p{font-size:12px;color:var(--ink-2)}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:8px 0}
.locked-head svg{width:20px;height:20px;flex:none;margin-top:2px}
.dock{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
.dock .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.load{max-width:760px;margin:0 auto;padding:24px 0 32px}
.lstep{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.lstep:first-of-type{border-top:0}
.lstep .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.lstep .ico svg{width:14px;height:14px}
.lstep.done .ico{background:var(--ok-soft);color:var(--ok)}
.lstep.run .ico{background:var(--flag-soft);color:var(--flag)}
.lstep .t{font-weight:600}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wait{margin-top:12px;border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.wait.tell{border-style:solid;border-color:var(--accent);box-shadow:var(--shadow)}
.slow{margin-top:12px;font-size:13px;background:var(--flag-soft);color:var(--ink);border-radius:10px;padding:8px 12px}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,8,.5)}
.dlg{padding:20px}
.dlg input[type=number]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;width:64px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:12px;max-height:46vh;overflow:auto;padding:2px}
.pg{border:2px solid var(--accent);border-radius:8px;padding:3px;background:var(--surface);text-align:center;font-size:11px;position:relative}
.pg img{width:100%;height:70px;object-fit:cover;object-position:top;border-radius:4px;background:#fff}
.pg.out{border-color:var(--line)}
.pg.out img{opacity:.25;filter:grayscale(1)}
.pg .lab{display:block;color:var(--ink-2);margin-top:2px}
.pg .tick{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pg.out .tick{background:var(--surface-2);color:transparent}
.pg .tick svg{width:11px;height:11px}
.sugg{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warn{color:var(--flag);font-size:13px;margin-top:8px}
.srcnote{font-size:12px;color:var(--ink-3);margin-top:16px}
.key{font-size:12px;color:var(--ink-2);margin-top:8px}
.key summary{cursor:pointer;color:var(--ink-3)}
.key table{border-collapse:collapse;margin-top:6px}
.key td{padding:2px 10px 2px 0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--flag);font-weight:600}

/* ---- review-screen variants (confirm.html) ---- */
.col1{max-width:780px;margin:0 auto;padding-top:20px;padding-bottom:40px}
.grp{margin-top:18px}
.grp>h2{font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp>h2 .cnt{font-family:"Figtree",system-ui,sans-serif;font-size:13px;font-weight:600;color:var(--ink-3)}
.list{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.list .sub{padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-top:1px solid var(--line)}
.list .sub:first-child{border-top:0}
.it{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.list .sub+.it,.list>.it:first-child{border-top:0}
.it.nosk{grid-template-columns:minmax(0,1fr) auto}
.it .sk{grid-row:span 2;width:52px;height:38px;color:var(--ink-2)}
.it .k{font-size:13px;color:var(--ink-2)}
.it .k svg{color:var(--lock)}
.it .v{font-weight:600;min-width:0}
.it .v s{font-weight:400;color:var(--ink-3);margin-right:6px}
.it .by{grid-column:-3/-1;font-size:12px;color:var(--ink-3)}
.it.nosk .by{grid-column:1/-1}
.it .by.warn2{color:var(--flag)}
.it .chg{font-size:13px;color:var(--accent);background:none;border:0;padding:4px 0;grid-row:1/span 2;grid-column:-2}
.it .more2{grid-column:1/-1;margin-top:8px}
.it.flip{background:color-mix(in srgb,var(--changed) 45%,transparent)}
.it.need{background:var(--flag-soft);border-left:4px solid var(--flag);padding-left:10px}
.it.hl{background:color-mix(in srgb,var(--flag-soft) 55%,transparent);border-left:4px solid var(--flag-line);padding-left:10px}

/* port of rules.ts decide() — same facts, same settings */
function decide(d, s) {
  const preset = { story: "storybook", textbook: "textbook", reference: "reference" }[s.genre]
  const pageGrouping = d.pageStorage.value === "spreads-as-separate-pages"
    ? { value: "spread", rule: "Facing pages continue across the fold, so each pair is joined into one screen." }
    : { value: "single", rule: d.pageStorage.value === "spreads-as-wide-pages" ? "Spreads are already stored as one wide page." : "Pages stand alone." }
  const hasText = d.textLayer.value === "digital"
  let renderStrategy
  if (preset === "reference") renderStrategy = { value: "single_column", rule: "Reference material reads best as one clean column." }
  else if (preset === "textbook") renderStrategy = { value: "llm", rule: "Lessons and exercises need the AI layout to rebuild their structure." }
  else if (s.composition === "text-in-art") renderStrategy = hasText ? { value: "fixed_layout", rule: "Text is placed on the pictures, so the original page design is kept." } : { value: "llm-overlay", rule: "Text is on the pictures but the PDF has no real text, so the AI rebuilds it over the art." }
  else if (s.composition === "text-beside-art") renderStrategy = { value: "two_column_story", rule: "Text sits beside the pictures, so story text and art go side by side." }
  else renderStrategy = { value: "llm", rule: "Mostly text, so the AI layout reflows it." }
  const ex = s.exercises !== "none"
  const activitiesGenerator = preset === "textbook" && ex ? { value: "enabled", rule: "The book has exercises, so they become interactive activities." } : { value: "disabled", rule: ex ? "Activities are only made in the Textbook preset." : "No exercises for the reader." }
  const sectioningMode = preset === "textbook" && ex && renderStrategy.value !== "fixed_layout" ? { value: "dynamic", rule: "Pages mix reading and exercises, so each page is split into parts." } : { value: "page", rule: "Each page is one unit." }
  const figureExtraction = hasText && (s.diagrams !== "none" || d.vectorDiagrams.value) ? { value: "auto", rule: "Diagrams with text labels are kept together as figures." } : { value: "off", rule: hasText ? "No labelled diagrams." : "Without real text there are no labels to group." }
  return { preset: { value: preset, rule: `The book is ${s.genre === "reference" ? "reference material" : "a " + s.genre}.` }, renderStrategy, pageGrouping, sectioningMode, activitiesGenerator, figureExtraction }
}

/* Where reading A (one call, whole book) and reading B (page-by-page labels) disagree.
   matters = picking one or the other changes at least one setting. */
function disagreements(b) {
  const A = aiFacts(b), Bs = b.readingB.semantic
  return FACT_ORDER.filter((k) => A[k] !== Bs[k]).map((k) => {
    const sa = decide(b.measured, A), sb = decide(b.measured, { ...A, [k]: Bs[k] })
    const changes = SETTING_ORDER.filter((s) => sa[s].value !== sb[s].value)
    return { fact: k, a: A[k], b: Bs[k], changes, matters: changes.length > 0 }
  })
}

/* What the page-by-page reading saw, as a short sentence */
function readingBSummary(b) {
  const c = {}
  for (const p of b.readingB.pages) c[p.type] = (c[p.type] || 0) + 1
  const names = { cover: "cover", "front-matter": "front matter", "back-matter": "back matter", blank: "blank", story: "story", lesson: "lesson", exercise: "exercise", informational: "information" }
  return Object.entries(c).map(([t, n]) => `${n} ${names[t] || t}`).join(" · ")
}

function spreadPairs(b) {
  const e = b.measured.pageStorage.evidence || []
  const out = []
  for (let i = 0; i + 1 < e.length; i += 2) out.push([e[i], e[i + 1]].sort((x, y) => x - y))
  return out.sort((x, y) => x[0] - y[0])
}

function measuredLine(b) {
  const m = b.measured
  return `${b.pageCount} pages · ${langName(m.language.guess)} · ${m.textLayer.value === "digital" ? "real text" : "scanned"}`
}

/* evidence for a locked setting, as HTML */
function lockedEvidence(b, key, sem) {
  const m = b.measured
  if (key === "pageGrouping") {
    const pairs = spreadPairs(b)
    if (m.pageStorage.value === "spreads-as-separate-pages")
      return { text: `Measured: ${m.pageStorage.detail.replace("gutter", "fold")}.`, html: `<div class="row wrapflex">${pairs.slice(0, 2).map(([x, y]) => `<button class="spreadpair" data-zoom="${x}"><img src="${img(b, x)}" alt="Page ${x}"><img src="${img(b, y)}" alt="Page ${y}"></button>`).join("")}</div>` }
    if (m.pageStorage.value === "spreads-as-wide-pages")
      return { text: `Measured: every page is landscape, so each page already holds a full spread.`, html: thumbs(b, [2, 3]) }
    return { text: `Measured: ${m.pageStorage.detail.replace("gutter", "fold")}. Each page stands alone.`, html: thumbs(b, [2, 3]) }
  }
  if (key === "figureExtraction") {
    const v = m.vectorDiagrams
    const t = sem.diagrams === "none" && !v.value ? `No labelled diagrams found.` : `Labelled figures: the AI says “${FACTS.diagrams.opts[sem.diagrams][0].toLowerCase()}”, the PDF has drawn diagrams on ${v.pagesWithDiagrams} page${v.pagesWithDiagrams === 1 ? "" : "s"}.`
    const pages = (b.readingA.diagrams.evidencePages || []).slice(0, 3)
    return { text: t, html: sem.diagrams !== "none" ? thumbs(b, pages) : "" }
  }
  return { text: "", html: "" }
}

function thumbs(b, pages, cited = []) {
  return `<div class="thumbs">${pages.map((p) => `<button class="thumb ${cited.includes(p) ? "cited" : ""}" data-zoom="${p}" aria-label="Open page ${p}"><img src="${img(b, p)}" alt="" loading="lazy"><span class="pn">p${p}</span></button>`).join("")}</div>`
}

  const pic = (cls = "pic") => im ? `<img class="${cls}" src="${im}" alt="">` : `<div class="ph"></div>`
  const pairs = spreadPairs(book)[0]
  const spread = opts.spread && pairs, widePages = book.measured.pageStorage.value === "spreads-as-wide-pages"
  switch (v) {
    case "fixed_layout": return `<div class="device ${sm} ${spread || widePages ? "wide" : ""}"><div class="fit">${spread ? `<img src="${img(book, pairs[0])}" alt="" style="width:50%"><img src="${img(book, pairs[1])}" alt="" style="width:50%">` : im ? `<img src="${im}" alt="">` : '<div class="ph" style="height:100%;width:100%"></div>'}</div></div>`
    case "two_column_story": return `<div class="device ${sm} wide"><div class="two">${im ? `<img src="${im}" alt="">` : '<div class="ph" style="width:50%;height:100%"></div>'}<div>${ln(90)}${ln(80)}${ln(95)}${ln(60)}</div></div></div>`
    case "llm": return `<div class="device ${sm}"><div class="hd"></div>${ln(95)}${ln(80)}${pic()}<div class="box">${ln(90)}${ln(70)}</div>${ln(92)}${ln(85)}</div>`
    case "single_column": return `<div class="device ${sm}"><div class="col"><div class="hd" style="width:90%"></div>${ln(100)}${ln(96)}${ln(100)}${ln(94)}${ln(100)}${ln(90)}${ln(100)}${ln(70)}</div></div>`
    case "llm-overlay": return `<div class="device ${sm}"><div class="fit">${im ? `<img src="${im}" alt="">` : ""}</div></div>`
  }
  return ""
}
const LAYOUT_SAY = {
  fixed_layout: "Your pages look as printed. The words stay on the picture, and can still be read aloud.",
  two_column_story: "The picture on one side and the words on the other. Words can be made bigger and read aloud.",
  llm: "The same words and pictures, arranged again so they fit any screen. Headings, boxes and pictures keep their order.",
  single_column: "One long column of text, like an article on a website. Figures sit between paragraphs.",
  "llm-overlay": "The picture stays, and the words are redrawn on it as real text.",
}
function layoutPreview(v, spread) {
  const mostlyWords = factsNow().composition === "text-mostly" && ["llm", "single_column"].includes(v)
  return `<div class="preview">${device(v, { spread })}<p>${LAYOUT_SAY[v]}${!bodyPage() ? " <i>(Sketch: we never saw a page of the book itself.)</i>" : ""}${mostlyWords ? " <br><span class=\"faint\">For a book that is mostly words, “Rebuilt” and “One column” look almost the same.</span>" : ""}</p></div>`
}

/* ---------- facing pages, said plainly ---------- */
function facing(st) {
  const m = book.measured.pageStorage
  if (m.value === "spreads-as-wide-pages") return { v: "Already side by side", ev: "Your PDF already has both pages side by side on each sheet, so each PDF page becomes one screen. Nothing to join." }
  if (m.value === "spreads-as-separate-pages") return { v: "Joined into one screen", ev: `We measured it: pictures run across ${m.detail.split(" of ")[0]} of ${m.detail.split(" of ")[1].split(" ")[0]} facing pairs, so each pair is shown together.` }
  return { v: "One page per screen", ev: "We measured it: no picture runs across two pages." }
}


const FLOW = "settings"
const FLOWS = {
  picks: ["Picks list", "v-picks-list"],
  result: ["Result first", "v-result-first"],
  sure: ["Sure vs not sure", "v-sure-unsure"],
  settings: ["Settings view", "v-settings"],
  sentence: ["One sentence", "v-sentence"],
}
const POLICIES = {
  P0: "Never ask",
  P1: "Ask when our two guesses differ",
  P2: "P1 + when we only saw opening pages",
  P3: "P2 + always ask maps (locked)",
  P4: "Ask only locked ones; highlight the rest",
}
const CHANGEABLE = ["renderStrategy", "activitiesGenerator", "preset", "sectioningMode"]
const LOCKED_S = ["pageGrouping", "figureExtraction"]
/* sentence words for the one-sentence variant */
const SAY = {
  genre: { story: "a story", textbook: "a school book", reference: "information to read" },
  composition: { "text-in-art": "the words are on the pictures", "text-beside-art": "the words are next to the pictures", "text-mostly": "it is mostly words" },
  exercises: { none: "nothing to write or mark", some: "things to write or mark on a few pages", many: "things to write or mark on most pages" },
  diagrams: { none: "no maps or labelled drawings", some: "a few maps or labelled drawings", many: "maps or labelled drawings on many pages" },
}

/* ---------- state ---------- */
let book, ans, qdone, src, keep, open, created, listOpen, policy

const guessP = (k) => { const f = book.facts[k]; return src === "whole" ? (f.secondReading ?? f.proposed) : f.proposed }
const guessW = (k) => { const f = book.facts[k]; return src === "whole" ? f.proposed : (f.secondReading ?? f.proposed) }
const frontOnly = () => book.coverage.onlyFrontMatter
const split = (k) => guessP(k) !== guessW(k)
const unsure = (k) => split(k) || frontOnly()
const aiPicks = () => Object.fromEntries(ORDER.map((k) => [k, guessP(k)]))
function factsNow() { const f = {}; for (const k of ORDER) f[k] = ans[k] ?? guessP(k); return f }
function valuesFor(k, f) { return Object.fromEntries(Object.keys(F[k].opts).map((o) => [o, decide(book.measured, { ...f, [k]: o })])) }
function variesFor(k, f) { const v = valuesFor(k, f); return Object.keys(S).filter((s) => new Set(Object.values(v).map((d) => d[s].value)).size > 1) }
const matters = (k, f) => variesFor(k, f).length > 0
const decidesLocked = (k, f) => variesFor(k, f).some((s) => S[s].locked)

/* The policy decides which picks become questions (must be answered) and which are only highlighted. Same as analyze-confirm.ts. */
function needs(k, f) {
  const m = matters(k, f)
  switch (policy) {
    case "P0": return false
    case "P1": return m && split(k)
    case "P2": return m && unsure(k)
    case "P3": return (m && unsure(k)) || (k === "diagrams" && decidesLocked(k, f))
    case "P4": return unsure(k) && decidesLocked(k, f)
  }
}
const highlighted = (k, f = factsNow()) => policy === "P4" && !needs(k, f) && unsure(k) && matters(k, f)
/* questions keep their place once answered, so the count does not jump */
function questions() { const f = factsNow(); return ORDER.filter((k) => qdone.includes(k) || (needs(k, f) && !(k in ans))) }
const pending = () => questions().filter((k) => !(k in ans))
const isQ = (k) => questions().includes(k)
const pendingSettings = () => { const f = factsNow(); return [...new Set(pending().flatMap((k) => variesFor(k, f)))] }

function setFact(k, v) { if (isQ(k) && !qdone.includes(k)) qdone.push(k); if (v === guessP(k) && !isQ(k)) delete ans[k]; else ans[k] = v; sync(); render() }

/* settings that differ from what the AI's picks gave */
function flips() {
  const a = decide(book.measured, aiPicks()), b = decide(book.measured, factsNow()), wait = pendingSettings()
  return Object.keys(S).filter((s) => a[s].value !== b[s].value && !wait.includes(s)).map((s) => ({ s, from: a[s].value, to: b[s].value }))
}
const val = (s, v) => s === "pageGrouping" ? ({ single: "One page per screen", spread: "Joined into one screen" })[v] : S[s].vals[v]
function valNow(s, st) { return s === "pageGrouping" ? facing(st).v : S[s].vals[st[s].value] }
function waitText(s) {
  const f = factsNow(), k = pending().find((x) => variesFor(x, f).includes(s))
  const opts = optionsFor(k)
  const vals = [...new Set(opts.map((o) => valuesFor(k, f)[o][s].value))].map((v) => val(s, v))
  return vals.join(" or ")
}

/* ---------- small pieces ---------- */
const lk = (n = 11) => lockIco(n)
const pagesTxt = (arr) => arr.length ? `page${arr.length > 1 ? "s" : ""} ${fmtPages(arr)}` : ""
const fmtPages = (arr) => { const s = [...arr].sort((a, b) => a - b), out = []; for (let i = 0; i < s.length; i++) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(i === j ? `${s[i]}` : `${s[i]}–${s[j]}`); i = j } return out.join(", ") }
const allPages = () => Array.from({ length: book.pageCount }, (_, i) => i + 1)
function sourceLine(k) {
  const f = factsNow(), v = f[k]
  if (k in ans && !qdone.includes(k)) return { t: "You changed this", cls: "" }
  if (k in ans) return { t: "Your answer", cls: "" }
  if (frontOnly()) return { t: "A guess from the opening pages only", cls: "warn2" }
  if (split(k) && highlighted(k)) return { t: `Our two guesses differ: ${F[k].opts[guessP(k)].toLowerCase()} or ${F[k].opts[guessW(k)].toLowerCase()}. Please check.`, cls: "warn2" }
  if (split(k)) return { t: matters(k, f) ? "Our two guesses differ" : "Our two guesses differ, but either gives the same settings", cls: "" }
  const c = (book.facts[k].citedPages || []).slice(0, 5)
  return { t: c.length ? `${v === "none" ? "Looked at" : "Seen on"} ${pagesTxt(c)}` : "", cls: "" }
}
function reason(k) {
  const P = F[k].opts[guessP(k)].toLowerCase(), W = F[k].opts[guessW(k)].toLowerCase()
  if (frontOnly()) return `We only saw the cover, title pages and a foreword, so this is a guess.${split(k) ? ` Our two guesses: <b>${P}</b> or <b>${W}</b>.` : ""}`
  if (split(k)) return `Page by page we'd say <b>${P}</b>. Looking at the whole book we'd say <b>${W}</b>.`
  if (F[k].locked) return `This can't be changed after import, so please confirm it.`
  return ""
}
function optionsFor(k) { return split(k) ? [guessP(k), guessW(k)] : Object.keys(F[k].opts) }
function effects(k, o, f = factsNow()) {
  const vals = valuesFor(k, f)[o], vary = variesFor(k, f)
  if (!vary.length) return "Changes nothing for this book"
  return vary.map((s) => `${S[s].locked ? lk() + " " : ""}${S[s].name}: <b>${valNow(s, vals)}</b>`).join(" · ")
}
function strip() {
  return `<div class="minstrip">${allPages().map((p) => { const t = (book.pageLabels.find((x) => x.page === p) || {}).type || "cover"; return `<figure><button data-zoom="${p}" style="padding:0;border:0;background:none"><img src="${img(book, p)}" alt=""></button><figcaption>${p === 1 ? "Cover" : PAGE[t] || t}</figcaption></figure>` }).join("")}</div>`
}
/* A needed question as a toggle (two guesses) or all options (only opening pages read). */
function toggle(k, opts = {}) {
  const f = factsNow(), cur = ans[k], list = optionsFor(k), all = Object.keys(F[k].opts)
  const tag = (o) => split(k) ? (o === guessP(k) ? "Page by page" : "Whole book") : (o === guessP(k) ? (frontOnly() ? "Our guess (opening pages only)" : "Our guess") : "")
  const extra = all.filter((o) => !list.includes(o))
  const safe = F[k].locked ? "some" : guessP(k)
  return `${opts.noWhy ? "" : `<p class="qwhy">${reason(k)}</p>`}${!opts.noStrip && frontOnly() && k === questions()[0] ? strip() : ""}
    <p class="qq">${q(k)}${F[k].locked ? ` <span class="badge lock">${ICON.lock}Can't change after import</span>` : ""}</p>
    <div class="seg" role="group" aria-label="${F[k].short}">${[...list, ...(cur && extra.includes(cur) ? [cur] : [])].map((o) => `<button aria-pressed="${cur === o}" data-fact="${k}:${o}">${tag(o) ? `<span class="tg">${tag(o)}</span>` : ""}<b>${F[k].opts[o]}</b><span class="ef">${effects(k, o, f)}</span></button>`).join("")}</div>
    <div class="alt">${extra.length && !(cur && extra.includes(cur)) ? `<span>Something else? ${extra.map((o) => `<button data-fact="${k}:${o}">${F[k].opts[o]}</button>`).join(" · ")}</span>` : ""}${cur ? "" : F[k].locked ? `<span>Not sure? <button data-fact="${k}:${safe}">Keep any labelled drawings whole</button> (safe either way)</span>` : `<span>Not sure? <button data-fact="${k}:${safe}">Use “${F[k].opts[safe]}”</button></span>`}</div>`
}
/* option list shown when a row's "Change" is open */
function factOptions(k) {
  const f = factsNow()
  return `<div class="chips2">${Object.keys(F[k].opts).map((o) => `<button aria-pressed="${f[k] === o}" data-fact="${k}:${o}"><span>${F[k].opts[o]}${o === guessP(k) ? ' <span class="faint small">· our pick</span>' : ""}</span><span class="ef">${effects(k, o, f)}</span></button>`).join("")}</div>${book.facts[k].plainOptions ? `<p class="tiny faint" style="margin-top:6px">${optDesc(k, f[k])}</p>` : ""}`
}

/* ---------- settings: "because", and which fact a setting change implies ---------- */
function because(s, f, st) {
  const ex = f.exercises !== "none", g = f.genre
  switch (s) {
    case "pageGrouping": return facing(st).ev
    case "figureExtraction": {
      if (pending().includes("diagrams")) return "Waiting for your answer about maps and labelled drawings."
      const c = book.facts.diagrams.citedPages || []
      if (st.figureExtraction.value === "auto") return f.diagrams !== "none" ? `Because there are maps or labelled drawings${c.length && !("diagrams" in ans) ? ` (${pagesTxt(c)})` : ""}.` : "Because the PDF has drawn diagrams."
      return book.measured.textLayer.value === "digital" ? "Because there are no maps or labelled drawings." : "Because the PDF has no real text to keep with them."
    }
    case "renderStrategy": {
      if (g === "textbook") return "Because it's a school book: lessons and tasks are rebuilt to fit the screen."
      if (g === "reference") return "Because it's information to read."
      return { "text-in-art": "Because the words are on the pictures.", "text-beside-art": "Because the words are next to the pictures.", "text-mostly": "Because it's mostly words." }[f.composition]
    }
    case "activitiesGenerator": return g !== "textbook" ? (ex ? "Because only school books get activities." : "Because there is nothing to write or mark.") : ex ? "Because it's a school book with things to write or mark." : "Because there is nothing to write or mark."
    case "preset": return `Because it's ${SAY.genre[g]}.`
    case "sectioningMode": return st.sectioningMode.value === "dynamic" ? "Because pages mix reading and tasks." : "Because each page is read as one unit."
  }
}
/* Smallest change to the facts that gives setting s the value v (1 fact, then 2). null = not possible for this PDF. */
function implied(s, v) {
  const f = factsNow(), m = book.measured, base = decide(m, f), cands = []
  const consider = (edit) => { const g = { ...f, ...edit }, d = decide(m, g); if (d[s].value !== v) return; cands.push({ edit, others: Object.keys(S).filter((x) => x !== s && d[x].value !== base[x].value), d }) }
  for (const k of ORDER) for (const o of Object.keys(F[k].opts)) if (o !== f[k]) consider({ [k]: o })
  if (!cands.length) for (const k1 of ORDER) for (const k2 of ORDER) if (k1 < k2) for (const o1 of Object.keys(F[k1].opts)) for (const o2 of Object.keys(F[k2].opts)) if (o1 !== f[k1] && o2 !== f[k2]) consider({ [k1]: o1, [k2]: o2 })
  cands.sort((a, b) => Object.keys(a.edit).length - Object.keys(b.edit).length || a.others.length - b.others.length)
  return cands[0] || null
}
function settingOptions(s) {
  const st = decide(book.measured, factsNow()), cur = st[s].value
  const vals = Object.keys(S[s].vals)
  return `<div class="chips2">${vals.map((v) => {
    if (v === cur) return `<button aria-pressed="true" disabled style="opacity:1"><span>${S[s].vals[v]} <span class="faint small">· now</span></span></button>`
    const im = implied(s, v)
    if (!im) return `<button disabled><span>${S[s].vals[v]}</span><span class="ef">Not possible for this PDF</span></button>`
    const means = Object.entries(im.edit).map(([k, o]) => `${F[k].short}: <b>${F[k].opts[o]}</b>`).join(" and ")
    const also = im.others.map((x) => `${S[x].locked ? lk() + " " : ""}${S[x].name}: <b>${valNow(x, im.d)}</b>`).join(" · ")
    return `<button data-implied="${s}:${v}"><span>${S[s].vals[v]}</span><span class="ef">Means ${means}.${also ? ` Also changes ${also}.` : ""}</span></button>`
  }).join("")}</div>`
}

/* ---------- shared rows ---------- */
function factRow(k, opts = {}) {
  const f = factsNow(), v = f[k], src = sourceLine(k), o = open === "f:" + k
  const need = isQ(k) && !(k in ans), hl = highlighted(k)
  const fl = flips().length && k in ans
  if (need) return `<div class="it nosk need"><div style="grid-column:1/-1"><div class="k">${F[k].short}${F[k].locked ? " " + lk() : ""} · <b style="color:var(--flag)">please answer</b></div>${toggle(k, opts)}</div></div>`
  const note = k === "exercises" && v === "none" && book.id.includes("colouring") ? `<div class="by">Colouring pages don't count, so no activities are made from them.</div>` : ""
  return `<div class="it ${hl ? "hl" : ""} ${fl ? "flip" : ""}">${sk(k, v)}<div class="k">${F[k].short}${F[k].locked ? " " + lk() : ""}</div><button class="chg" data-open="f:${k}">${o ? "Done" : "Change"}</button><div class="v">${F[k].opts[v]}</div><div class="by ${src.cls}">${src.t}</div>${note}${o ? `<div class="more2">${factOptions(k)}</div>` : ""}</div>`
}
function settingRow(s, opts = {}) {
  const f = factsNow(), st = decide(book.measured, f), o = open === "s:" + s, wait = pendingSettings().includes(s)
  const fl = flips().find((x) => x.s === s)
  const locked = S[s].locked
  const canChange = s !== "pageGrouping"
  return `<div class="it nosk ${locked ? "lockit" : ""} ${fl ? "flip" : ""} ${wait ? "waiting" : ""}"><div class="k">${locked ? lk() + " " : ""}${S[s].name}${locked ? " · can't change after import" : ""}</div>${canChange && !wait ? `<button class="chg" data-open="s:${s}">${o ? "Done" : "Change"}</button>` : "<span></span>"}
    <div class="v">${wait ? `Waiting: ${waitText(s)}` : `${fl ? `<s>${val(s, fl.from)}</s>` : ""}${valNow(s, st)}`}</div>
    <div class="by">${wait ? "Answer the question above to settle this." : because(s, f, st)}</div>
    ${opts.preview && s === "renderStrategy" && !wait ? `<div class="more2">${layoutPreview(st.renderStrategy.value, st.pageGrouping.value === "spread")}</div>` : ""}
    ${o ? `<div class="more2">${settingOptions(s)}</div>` : ""}${!canChange && o ? "" : ""}</div>`
}
function pagesRow() {
  const sug = suggestedPages(), k = keep || allPages(), left = allPages().filter((p) => !k.includes(p))
  const say = left.length ? `Leaves out ${pagesTxt(left)}.` : sug ? `The book seems to start on page ${book.coverage.contentStartsAt}. Keep the cover and skip page${allPages().filter((p) => !sug.includes(p)).length > 1 ? "s" : ""} ${fmtPages(allPages().filter((p) => !sug.includes(p)))}? <button class="lnk acc" data-sugg>Use this</button>` : frontOnly() ? "Every page looks like an opening page, so we can't tell where the book starts. Is this the right file?" : "Includes the cover."
  return `<div class="it nosk lockit"><div class="k">${lk()} Pages to import · can't change after import</div>${keep ? `<button class="chg" data-sugg-undo>Undo</button>` : "<span></span>"}<div class="v">${left.length ? `${k.length} of ${book.pageCount}: ${fmtPages(k)}` : `All ${book.pageCount} pages`}</div><div class="by ${frontOnly() ? "warn2" : ""}">${say}</div></div>`
}
function suggestedPages() { const body = book.coverage.bodyPages; if (!body.length) return null; const s = [1, ...body.filter((p) => p !== 1)]; return s.length === book.pageCount ? null : s }
/* askHere: a pending maps question is asked inside the locked rows (false when the variant asks it elsewhere) */
function lockedRows(askHere = true) {
  const dPend = pending().includes("diagrams")
  return `${settingRow("pageGrouping")}${dPend && askHere ? factRow("diagrams") : settingRow("figureExtraction")}${pagesRow()}`
}
function lockedBox(askHere = true) {
  return `<section class="grp lockbox"><h2>${ICON.lock.replace("<svg", '<svg width="18" height="18" style="color:var(--lock)"')}Can't change after import <span class="cnt">To change these later you'd add the book again</span></h2><div class="list" style="border-color:var(--lock-line)">${lockedRows(askHere)}</div></section>`
}
function flipsBox() {
  const fl = flips()
  if (!fl.length) return ""
  return `<div class="flips"><h3><span>What your changes did</span><button class="undo" data-undo>Undo all</button></h3><ul>${fl.map((x) => `<li class="${S[x.s].locked ? "lk" : ""}">${S[x.s].locked ? ICON.lock + " " : ""}${S[x.s].name}: <s>${val(x.s, x.from)}</s> → <b>${val(x.s, x.to)}</b>${S[x.s].locked ? " · can't change after import" : ""}</li>`).join("")}</ul></div>`
}
function statusLine() {
  const p = pending().length, hl = ORDER.filter((k) => highlighted(k)).length
  if (p) return `<div class="status unsure">${ICON.flag}<p><b>${p === 1 ? "One thing" : `${p} things`} we need you to answer.</b> ${frontOnly() ? "We only saw the opening pages of this file." : "Our two guesses differ."} Everything else is filled in.</p></div>`
  if (hl) return `<div class="status unsure">${ICON.flag}<p><b>Here's what we picked.</b> Please look at the highlighted ${hl === 1 ? "row" : "rows"}: our two guesses differ there.</p></div>`
  if (qdone.length) return `<div class="status calm">${ICON.check}<p><b>Thanks, that's everything.</b> Check the picks and create the book.</p></div>`
  return `<div class="status calm">${ICON.check}<p><b>Here's what we picked.</b> Change anything that's wrong, or create the book.</p></div>`
}
function head() {
  return `<div class="bookhead"><img src="${img(book, 1)}" alt=""><div><h1>${esc(book.title)}</h1><p class="muted small">${book.pageCount} pages · ${langName(book.measured.language.guess)} · ${book.measured.textLayer.value === "digital" ? "real text" : "scanned"}</p></div></div>`
}

/* ---------- variant 1: picks list ---------- */
function vPicks() {
  return `${statusLine()}
  <section class="grp"><div class="list">
    <div class="sub">About the book</div>${ORDER.filter((k) => k !== "diagrams").map((k) => factRow(k)).join("")}
    <div class="sub">What we'll make</div>${CHANGEABLE.map((s) => settingRow(s)).join("")}
    <div class="sub" style="color:var(--lock)">${lk()} Can't change after import</div>${lockedRows()}
  </div></section>${flipsBox()}`
}

/* ---------- variant 2: result first ---------- */
function vResult() {
  const f = factsNow(), st = decide(book.measured, f), p = pending(), wait = pendingSettings()
  const sum = `${p.includes("genre") ? "kind of book: waiting" : F.genre.opts[f.genre]} · words ${({ "text-in-art": "on the pictures", "text-beside-art": "next to the pictures", "text-mostly": "mostly on their own" })[f.composition]} · ${st.activitiesGenerator.value === "enabled" ? "activities from its exercises" : wait.includes("activitiesGenerator") ? "activities: waiting" : "no activities"} · ${facing(st).v.toLowerCase()}`
  const qs = p.map((k) => `<div class="drawer need">${toggle(k)}</div>`).join("")
  const lw = wait.includes("renderStrategy")
  const hero = `<div class="hero">${lw ? `<div class="cap"><h2>Waiting for your answer</h2><p>The page layout depends on the question above: ${waitText("renderStrategy")}.</p></div>` : `${device(st.renderStrategy.value, { spread: st.pageGrouping.value === "spread" })}<div class="cap"><p class="tiny faint">How a page of this book will look</p><h2>${S.renderStrategy.vals[st.renderStrategy.value]}</h2><p>${LAYOUT_SAY[st.renderStrategy.value]}</p>${!bodyPage() ? `<p><i>Sketch: we never saw a page of the book itself.</i></p>` : `<p class="tiny faint">Made from page ${bodyPage()} of your PDF.</p>`}</div>`}</div>`
  return `${statusLine()}
    ${qs ? `<section class="grp">${qs}</section>` : ""}
    <section class="grp">${hero}
      <p class="summary1"><b>${p.length ? "So far" : "In short"}:</b> ${sum}. <button class="lnk acc" data-list>${listOpen ? "Hide the list" : "Change"}</button></p>
      ${flipsBox()}
      ${listOpen ? `<div class="list" style="margin-top:12px"><div class="sub">About the book</div>${ORDER.filter((k) => k !== "diagrams" && !p.includes(k)).map((k) => factRow(k)).join("")}<div class="sub">What we'll make</div>${CHANGEABLE.map((s) => settingRow(s)).join("")}</div>` : ""}
    </section>
    ${lockedBox(false)}`
}

/* ---------- variant 3: sure vs not sure ---------- */
function vSure() {
  const f = factsNow(), p = pending(), hl = ORDER.filter((k) => highlighted(k)), st = decide(book.measured, f)
  const check = [...p, ...hl.filter((k) => !p.includes(k))].filter((k) => k !== "diagrams")
  const inLock = p.includes("diagrams")
  const answered = qdone.filter((k) => k in ans)
  const sureF = ORDER.filter((k) => k !== "diagrams" && !check.includes(k))
  const sureOpen = open?.startsWith("f:") || open?.startsWith("s:") || params().has("sure")
  const line = (k) => `<div class="oneline"><span class="k">${F[k].short}</span><span class="v">${F[k].opts[f[k]]}${k in ans ? ' <span class="small" style="color:var(--accent)">· yours</span>' : ""}</span><button class="chg" data-open="f:${k}">Change</button></div>${open === "f:" + k ? `<div style="padding:4px 14px 12px">${factOptions(k)}</div>` : ""}`
  const sline = (s) => `<div class="oneline"><span class="k">${S[s].name}</span><span class="v">${pendingSettings().includes(s) ? `<span style="color:var(--flag)">${waitText(s)}</span>` : S[s].vals[st[s].value]}</span><button class="chg" data-open="s:${s}">Change</button></div>${open === "s:" + s ? `<div style="padding:4px 14px 12px">${settingOptions(s)}</div>` : ""}`
  return `${statusLine()}
    ${check.length || inLock ? `<section class="grp"><h2>${ICON.flag.replace("<svg", '<svg width="18" height="18" style="color:var(--flag)"')}Please check <span class="cnt">${p.length ? `${p.length} to answer${inLock ? ", 1 of them in the locked group below" : ""}` : "pre-filled, look before you create"}</span></h2>${check.length ? `<div class="list">${check.map((k) => factRow(k)).join("")}</div>` : `<p class="small muted">Only the question in the locked group below.</p>`}</section>` : answered.length ? `<section class="grp"><h2>You answered <span class="cnt">${answered.length}</span></h2><div class="list">${answered.filter((k) => k !== "diagrams").map((k) => factRow(k)).join("")}</div></section>` : ""}
    ${lockedBox()}
    <section class="grp"><details ${sureOpen ? "open" : ""}><summary style="cursor:pointer"><h2 style="display:inline;font-size:17px">We're sure</h2> <span class="small muted">${sureF.length + CHANGEABLE.length} picks, one line each · can change later</span></summary>
      <div class="list" style="margin-top:8px">${sureF.map(line).join("")}${CHANGEABLE.map(sline).join("")}</div></details></section>
    ${flipsBox()}`
}

/* ---------- variant 4: settings view ---------- */
function vSettings() {
  const p = pending()
  return `${statusLine()}
    ${p.length ? `<section class="grp"><h2>We need one answer</h2><div class="list">${p.map((k) => `<div class="it nosk need"><div style="grid-column:1/-1"><div class="k">Decides: ${variesFor(k, factsNow()).map((s) => S[s].name).join(", ")}</div>${toggle(k)}</div></div>`).join("")}</div></section>` : ""}
    <section class="grp"><h2>Your book will be made like this</h2><div class="list">${CHANGEABLE.map((s) => settingRow(s, { preview: true })).join("")}</div></section>
    <section class="grp lockbox"><h2>${ICON.lock.replace("<svg", '<svg width="18" height="18" style="color:var(--lock)"')}Can't change after import</h2><div class="list" style="border-color:var(--lock-line)">${settingRow("pageGrouping")}${settingRow("figureExtraction")}${pagesRow()}</div></section>
    ${flipsBox()}`
}

/* ---------- variant 5: one sentence ---------- */
function vSentence() {
  const f = factsNow(), st = decide(book.measured, f), p = pending(), wait = pendingSettings(), fl = flips().map((x) => x.s)
  const pill = (k) => {
    const need = p.includes(k), on = open === "f:" + k || (need && !open)
    const txt = need ? (split(k) ? optionsFor(k).map((o) => SAY[k][o]).join(" or ") + "?" : F[k].short.toLowerCase() + "?") : SAY[k][f[k]]
    return `<button class="pill ${need ? "need" : highlighted(k) ? "hl" : ""} ${k in ans && !qdone.includes(k) ? "flip" : ""} ${on ? "on" : ""}" data-open="f:${k}">${F[k].locked ? ICON.lock + " " : ""}${txt}</button>`
  }
  const spill = (s, txt) => `<button class="pill ${fl.includes(s) ? "flip" : ""} ${open === "s:" + s ? "on" : ""}" data-open="s:${s}" ${s === "pageGrouping" ? "disabled" : ""}>${S[s].locked ? ICON.lock + " " : ""}${wait.includes(s) ? "(waiting for your answer)" : txt}</button>`
  const openK = open?.startsWith("f:") ? open.slice(2) : p.find((k) => !open) || null
  const openS = open?.startsWith("s:") ? open.slice(2) : null
  const k = keep || allPages()
  return `${statusLine()}
    <p class="sent">This is ${pill("genre")}, and ${pill("composition")}. It has ${pill("exercises")} and ${pill("diagrams")}.</p>
    ${openK ? `<div class="drawer ${p.includes(openK) ? "need" : ""}">${p.includes(openK) ? toggle(openK) : `<p class="qq">${q(openK)}</p>${factOptions(openK)}`}</div>` : ""}
    <p class="sent" style="font-size:19px;margin-top:22px">So we'll make it with ${spill("renderStrategy", S.renderStrategy.vals[st.renderStrategy.value].toLowerCase())}, ${spill("activitiesGenerator", st.activitiesGenerator.value === "enabled" ? "interactive exercises" : "no activities")}, and ${spill("pageGrouping", facing(st).v.toLowerCase())}.</p>
    ${openS ? `<div class="drawer"><p class="qq">${S[openS].name}</p>${settingOptions(openS)}</div>` : ""}
    <p class="sent2">Starting template: ${S.preset.vals[st.preset.value]} · Reading parts: ${S.sectioningMode.vals[st.sectioningMode.value]} · <button class="lnk acc" data-list>${listOpen ? "Hide" : "Why?"}</button></p>
    ${listOpen ? `<div class="list" style="margin-top:8px">${CHANGEABLE.map((s) => settingRow(s)).join("")}</div>` : ""}
    ${flipsBox()}
    ${lockedBox(false)}`
}

/* ---------- done, tester box, page ---------- */
function vDone() {
  const st = decide(book.measured, factsNow()), k = keep || allPages()
  const changed = Object.keys(ans).filter((x) => !qdone.includes(x)).length
  return `<div class="card done" style="padding:20px"><div class="status calm" style="margin-top:0">${ICON.check}<p><b>Book created</b> (prototype). ${qdone.length} question${qdone.length === 1 ? "" : "s"} answered, ${changed} pick${changed === 1 ? "" : "s"} changed.</p></div>
    <ul class="small" style="margin-top:12px;padding-left:18px">${Object.keys(S).map((s) => `<li>${S[s].locked ? lk() + " " : ""}${S[s].name}: <b>${valNow(s, st)}</b></li>`).join("")}<li>${lk()} Pages: <b>${k.length === book.pageCount ? `all ${book.pageCount}` : `${k.length} of ${book.pageCount}`}</b></li></ul>
    <button class="btn" data-again style="margin-top:12px">Back to the review</button></div>`
}
function tester() {
  const f = factsNow()
  const rows = ORDER.map((k) => { const t = book.facts[k].trueAnswer || [], c = (x) => t.includes(x) ? "ok" : "bad"
    return `<tr><td>${F[k].short}</td><td>${t.map((x) => F[k].opts[x]).join(" or ")}</td><td class="${c(guessP(k))}">${F[k].opts[guessP(k)]}</td><td class="${c(guessW(k))}">${F[k].opts[guessW(k)]}</td><td class="${c(f[k])}">${F[k].opts[f[k]]}</td></tr>` }).join("")
  return `<details class="tester" ${params().has("tester") ? "open" : ""}><summary style="cursor:pointer;color:var(--ink-3)">For testers: asking policy, where the pick comes from, the answer key</summary>
    <div class="row wrapflex"><span class="faint">Asking policy:</span>${Object.entries(POLICIES).map(([p, n]) => `<button class="chip" aria-pressed="${p === policy}" data-policy="${p}" title="${n}">${p} · ${n}</button>`).join("")}</div>
    <div class="row wrapflex"><span class="faint">Pick shown:</span><button class="chip" aria-pressed="${src !== "whole"}" data-src="pages">page-by-page reading (E5 run 1)</button><button class="chip" aria-pressed="${src === "whole"}" data-src="whole">whole-book reading (E4 run 1)</button></div>
    <table style="margin-top:8px;border-collapse:collapse"><tr><td></td><td><b>Right</b></td><td><b>Shown pick</b></td><td><b>Other guess</b></td><td><b>Now</b></td></tr>${rows}</table>
    <p class="faint" style="margin-top:6px">Policy numbers over every saved run pair: results/poc/confirm-policies.json (analyze-confirm.ts).</p></details>`
}
function render() {
  $("#flowname").textContent = FLOWS[FLOW][0]
  $("#vnav").innerHTML = Object.entries(FLOWS).map(([k, [n, dir]]) => `<a href="../${dir}/index.html?book=${book.id}${src === "whole" ? "&src=whole" : ""}${policy !== "P2" ? "&policy=" + policy : ""}" ${k === FLOW ? 'aria-current="page"' : ""}>${n}</a>`).join("") + `<a href="../confirm-variants.html">All variants</a>`
  const cur = book
  $("#books").innerHTML = DATA.books.map((b) => { book = b; const save = [ans, qdone]; ans = {}; qdone = []; const n = pending().length; [ans, qdone] = save; book = cur; return `<button class="bookbtn" aria-pressed="${b.id === cur.id}" data-book="${b.id}"><img src="${img(b, 1)}" alt="">${esc(b.short)}${n ? '<span class="wrongdot" title="Has a question"></span>' : ""}</button>` }).join("")
  const body = created ? vDone() : { picks: vPicks, result: vResult, sure: vSure, settings: vSettings, sentence: vSentence }[FLOW]()
  $("#app").innerHTML = `<div class="wrap"><div class="col1">${head()}${body}${tester()}</div></div>`
  const p = pending().length, edits = Object.keys(ans).length
  $("#dock").hidden = created
  $("#dock").innerHTML = `<div class="wrap" style="max-width:812px"><span class="small muted">${p ? `${p} to answer first${pending().some((k) => F[k].locked) ? ", one can't change later" : ""}` : `<span class="row" style="gap:6px">${lk(14)} 3 things can't change after this</span>`}</span><button class="btn primary" data-create ${p ? "disabled" : ""}>${p ? "Create book" : edits ? "Create book" : "Looks right · Create book"}</button></div>`
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button")
  if (!t) return
  const d = t.dataset
  if (d.book) { pick(d.book); return }
  if (d.fact) { const [k, v] = d.fact.split(":"); setFact(k, v); return }
  if (d.open) { open = open === d.open ? null : d.open; sync(); render(); return }
  if (d.implied) { const [s, v] = d.implied.split(":"); const im = implied(s, v); if (im) { for (const [k, o] of Object.entries(im.edit)) { if (isQ(k) && !qdone.includes(k)) qdone.push(k); ans[k] = o } } open = null; sync(); render(); return }
  if ("undo" in d) { for (const k of Object.keys(ans)) if (!qdone.includes(k)) delete ans[k]; sync(); render(); return }
  if ("list" in d) { listOpen = !listOpen; render(); return }
  if ("sugg" in d) { keep = suggestedPages(); sync(); render(); return }
  if ("suggUndo" in d) { keep = null; sync(); render(); return }
  if ("create" in d) { created = true; render(); scrollTo(0, 0); return }
  if ("again" in d) { created = false; render(); return }
  if (d.policy) { policy = d.policy; ans = {}; qdone = []; setParam("policy", policy === "P2" ? null : policy); sync(); render(); return }
  if (d.src) { src = d.src === "whole" ? "whole" : null; ans = {}; qdone = []; setParam("src", src); sync(); render(); return }
})
const enc = (o) => Object.entries(o).map(([k, v]) => `${k}:${v}`).join(",") || null
const dec = (s) => Object.fromEntries((s || "").split(",").filter(Boolean).map((x) => x.split(":")))
function sync() { setParam("a", enc(ans)); setParam("q", qdone.join(",") || null); setParam("open", open); setParam("pages", keep ? "sugg" : null) }
function pick(id) { book = bookById(id); ans = {}; qdone = []; open = null; keep = null; created = false; listOpen = false; ["a", "q", "open", "pages"].forEach((k) => setParam(k, null)); setParam("book", id); render() }
function init() {
  const p = params()
  book = bookById(p.get("book") || DATA.books[0].id)
  policy = p.get("policy") || "P2"; src = p.get("src") === "whole" ? "whole" : null
  ans = dec(p.get("a")); qdone = (p.get("q") || "").split(",").filter(Boolean)
  // answers given in the URL to facts that are questions count as answered questions
  for (const k of Object.keys(ans)) if (!qdone.includes(k) && needs(k, { ...aiPicks(), ...ans })) qdone.push(k)
  open = p.get("open"); keep = p.get("pages") === "sugg" ? suggestedPages() : null; created = p.has("created"); listOpen = p.has("list")
  setupTheme(); setupLightbox(() => book); render()
}
init()
</script>
</body>
</html>
