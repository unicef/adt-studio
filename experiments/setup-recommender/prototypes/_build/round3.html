<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/*BASE_CSS*/
.flows{display:flex;gap:4px;flex-wrap:wrap;padding:8px 0 0}
.flows a{font-size:13px;text-decoration:none;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.flows a[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding-top:20px;padding-bottom:32px}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.bookhead{display:flex;gap:14px;align-items:center}
.bookhead img{width:56px;border-radius:6px;border:1px solid var(--line);flex:none}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-top:16px;font-size:15px}
.status svg{width:18px;height:18px;flex:none;margin-top:2px}
.status.calm{background:var(--ok-soft);color:var(--ok)}
.status.unsure{background:var(--flag-soft);color:var(--flag)}
.status p{color:var(--ink)}
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sec-h h2{font-size:17px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip figure{margin:0;flex:none;width:58px;text-align:center}
.strip button{padding:0;border:0;background:none;display:block;width:100%}
.strip img{width:58px;height:80px;object-fit:cover;object-position:top;border-radius:5px;border:1px solid var(--line);background:#fff}
.strip figcaption{font-size:11px;line-height:1.2;color:var(--ink-2);margin-top:3px}
.strip figure.front figcaption{color:var(--flag);font-weight:600}
.strip figure.off img{opacity:.25;filter:grayscale(1)}
.strip figure.off figcaption{text-decoration:line-through}
.strip .gap{flex:none;align-self:center;color:var(--ink-3);font-size:12px;padding:0 2px 16px}
.pagebar{display:flex;gap:1px;height:10px;margin-top:6px;border-radius:3px;overflow:hidden}
.pagebar i{flex:1;background:var(--surface-2)}
.pagebar i.read{background:var(--accent)}
.pagebar i.read.front{background:var(--flag)}
.facts{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.fact{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;align-items:center}
.fact:first-child{border-top:0}
.fact .sk{grid-row:span 2;width:52px;height:38px;color:var(--ink-2)}
.fact .q{font-size:13px;color:var(--ink-2)}
.fact .a{font-weight:600}
.fact .a .you{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px}
.fact .src{grid-column:2/-1;font-size:12px;color:var(--ink-3)}
.fact .chg{font-size:13px;color:var(--accent);background:none;border:0;padding:4px 0}
.fact .pick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fact .note{grid-column:1/-1;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 8px;margin-top:4px}
.fact.guess .src{color:var(--flag)}
.qcard{border:1.5px solid var(--flag-line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.qcard.calm{border-color:var(--line)}
.qcard.lockq{border-color:var(--lock-line)}
.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 16px;background:var(--flag-soft);font-size:13px;color:var(--flag);font-weight:600;flex-wrap:wrap}
.qcard.calm .qtop{background:var(--surface-2);color:var(--ink-2)}
.qcard.lockq .qtop{background:var(--lock-soft);color:var(--lock)}
.qbody{padding:16px}
.qbody h2{font-size:21px;margin:12px 0 4px}
.why{font-size:14px;color:var(--ink-2)}
.why b{color:var(--ink)}
.teach{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.help{font-size:13px;color:var(--ink-2);margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt:hover{border-color:var(--ink-3)}
.opt .sk{width:64px;height:46px;color:var(--ink-2)}
.opt b{font-size:15px}
.opt .d{font-size:12px;color:var(--ink-2)}
.opt .eff{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:6px;margin-top:auto;display:flex;flex-direction:column;gap:3px}
.opt .eff span b{font-size:12px;color:var(--ink)}
.opt .eff svg{width:11px;height:11px;vertical-align:-1px;color:var(--lock)}
.opt .tag{align-self:flex-start;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .mini{display:flex;justify-content:flex-start}
.qfoot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--flag)}
.dots i.done{background:var(--accent)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.vs>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vs .k{font-size:12px;color:var(--ink-3)}
.panel{align-self:start;position:sticky;top:96px}
@media (max-width:880px){.panel{position:static}}
.lockitem{padding:12px 16px;border-top:1px solid var(--lock-line)}
.lockitem:first-of-type{border-top:0}
.lockitem .k{font-size:13px;color:var(--ink-2)}
.lockitem .v{font-weight:600}
.lockitem .v.pending{color:var(--flag)}
.lockitem .ev{font-size:12px;color:var(--ink-2);margin-top:4px}
.lnk{font-size:12px;color:var(--lock);background:none;border:0;padding:0;margin-top:4px;text-decoration:underline}
.lnk.acc{color:var(--accent);font-size:13px}
.later{padding:4px 16px 12px}
.preview{margin:10px 0 4px;display:flex;gap:12px;align-items:center}
.device{flex:none;width:118px;height:160px;border:2px solid var(--ink-3);border-radius:12px;background:#fff;padding:7px;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.device.wide{width:190px;height:140px}
.device.sm{width:74px;height:100px;padding:5px;gap:3px;border-radius:9px}
.device.sm.wide{width:120px;height:86px}
.device img{width:100%;border-radius:3px}
.device .ln{height:4px;border-radius:2px;background:#8a857a;opacity:.6;flex:none}
.device.sm .ln{height:3px}
.device .hd{height:7px;width:70%;border-radius:2px;background:#5b574e;flex:none}
.device .two{display:flex;gap:6px;flex:1;min-height:0}
.device .two img{width:50%;height:100%;object-fit:cover}
.device .two div{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:center}
.device .fit{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.device .fit img{max-height:100%;width:auto;max-width:100%;object-fit:contain}
.device .pic{height:40px;object-fit:cover;flex:none}
.device .ph{height:34px;border-radius:3px;background:#d9d4c8;flex:none}
.device .box{border:1px solid #c9c3b6;border-radius:4px;padding:3px;display:flex;flex-direction:column;gap:3px;flex:none}
.device .col{padding:0 10%;display:flex;flex-direction:column;gap:4px}
.device .cap{height:3px;width:50%;background:#b5afa3;border-radius:2px;margin:0 auto;flex:none}
.preview p{font-size:12px;color:var(--ink-2)}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:8px 0}
.locked-head svg{width:20px;height:20px;flex:none;margin-top:2px}
.dock{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
.dock .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.load{max-width:760px;margin:0 auto;padding:24px 0 32px}
.lstep{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.lstep:first-of-type{border-top:0}
.lstep .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.lstep .ico svg{width:14px;height:14px}
.lstep.done .ico{background:var(--ok-soft);color:var(--ok)}
.lstep.run .ico{background:var(--flag-soft);color:var(--flag)}
.lstep .t{font-weight:600}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wait{margin-top:12px;border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.wait.tell{border-style:solid;border-color:var(--accent);box-shadow:var(--shadow)}
.slow{margin-top:12px;font-size:13px;background:var(--flag-soft);color:var(--ink);border-radius:10px;padding:8px 12px}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,8,.5)}
.dlg{padding:20px}
.dlg input[type=number]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;width:64px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:12px;max-height:46vh;overflow:auto;padding:2px}
.pg{border:2px solid var(--accent);border-radius:8px;padding:3px;background:var(--surface);text-align:center;font-size:11px;position:relative}
.pg img{width:100%;height:70px;object-fit:cover;object-position:top;border-radius:4px;background:#fff}
.pg.out{border-color:var(--line)}
.pg.out img{opacity:.25;filter:grayscale(1)}
.pg .lab{display:block;color:var(--ink-2);margin-top:2px}
.pg .tick{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pg.out .tick{background:var(--surface-2);color:transparent}
.pg .tick svg{width:11px;height:11px}
.sugg{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warn{color:var(--flag);font-size:13px;margin-top:8px}
.srcnote{font-size:12px;color:var(--ink-3);margin-top:16px}
.key{font-size:12px;color:var(--ink-2);margin-top:8px}
.key summary{cursor:pointer;color:var(--ink-3)}
.key table{border-collapse:collapse;margin-top:6px}
.key td{padding:2px 10px 2px 0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--flag);font-weight:600}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand">Add book · auto<small>Round 3 · <span id="flowname"></span></small></div>
  <nav class="books" id="books" aria-label="Books"></nav>
  <button class="iconbtn" id="theme" aria-label="Toggle theme"></button>
  <nav class="flows" id="flows" aria-label="Directions" style="flex-basis:100%"></nav>
</div></header>
<main id="app"></main>
<div class="dock" id="dock" hidden></div>
<dialog id="dlg"></dialog>
<script>
/*DATA*/
/*BASE_JS*/
const FLOW = "/*FLOW*/"
const FLOWS = { check: ["Check, then ask", "r3-check-then-ask"], tell: ["Tell us while we read", "r3-tell-while-reading"], teach: ["Teach me", "r3-teach-me"] }

/* ---------- words: short labels are the designer's, descriptions come from the dev's book files (plainQuestion / plainOptions) ---------- */
const F = {
  genre: { short: "Kind of book", tag: "kind of book", help: "Think of the whole book, not only the first pages.",
    opts: { story: "A story", textbook: "A school book", reference: "Information to read" } },
  exercises: { short: "Things to write or mark", tag: "exercises",
    opts: { none: "No", some: "On a few pages", many: "On most pages" } },
  composition: { short: "Where the words are", tag: "where the words are", help: "Look at a typical page in the middle of the book.",
    opts: { "text-in-art": "On the picture", "text-beside-art": "Next to the picture", "text-mostly": "Mostly words" } },
  diagrams: { short: "Maps, charts, labelled drawings", tag: "maps and charts", locked: true,
    opts: { none: "None", some: "A few", many: "On many pages" } },
}
/* what each fact is for, in one line (teach mode) */
const TEACH = {
  genre: "This picks the starting template. Stories, school books and information pages are laid out differently, and only school books get interactive activities.",
  exercises: "Tasks the reader writes or marks an answer to can become interactive activities, and their pages get split into a reading part and a task part.",
  composition: "This decides whether we keep your printed page as it is, put the picture next to the words, or rebuild the page to fit any screen.",
  diagrams: "Maps, charts and labelled drawings are cut out together with their labels, so the labels stay readable. This happens when the book is imported, so it can't be changed later.",
}
const S = {
  pageGrouping: { name: "Facing pages", locked: true },
  figureExtraction: { name: "Maps and labelled drawings", locked: true, vals: { off: "Treated as normal pictures", auto: "Kept whole, with their labels" } },
  renderStrategy: { name: "Page layout", vals: { fixed_layout: "Keep the printed page", two_column_story: "Picture beside the words", llm: "Rebuilt to fit the screen", single_column: "One column, like an article", "llm-overlay": "Words redrawn over the picture" } },
  activitiesGenerator: { name: "Activities", vals: { enabled: "Exercises become interactive", disabled: "None" } },
  preset: { name: "Starting template", vals: { storybook: "Story", textbook: "School book", reference: "Information" } },
  sectioningMode: { name: "Reading parts", vals: { page: "One page at a time", dynamic: "Each page split into reading and tasks" } },
}
const PAGE = { cover: "Cover", "front-matter": "Opening", "back-matter": "End pages", blank: "Blank", story: "Story", lesson: "Lesson", exercise: "Exercise", informational: "Information" }
const BODY = (t) => !["cover", "front-matter", "back-matter", "blank"].includes(t)
const ORDER = ["genre", "exercises", "composition", "diagrams"]
const q = (k) => book.facts[k].plainQuestion
const optDesc = (k, o) => book.facts[k].plainOptions[o]

/* ---------- sketches ---------- */
function sk(fact, v) {
  const L = (x, y, w) => `<rect x="${x}" y="${y}" width="${w}" height="3" rx="1.5" fill="currentColor" opacity=".55"/>`
  const P = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="currentColor" opacity=".18"/><path d="M${x + 3} ${y + h - 3} l${w / 3} -${h / 2.2} l${w / 4} ${h / 4} l${w / 6} -${h / 6} l${w / 4 - 6} ${h / 2.2 - h / 4 + h / 6}" stroke="currentColor" opacity=".45" fill="none"/>`
  const box = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" opacity=".7"/>`
  const m = {
    "composition:text-in-art": P(5, 5, 54, 36) + L(10, 10, 26) + L(10, 16, 20),
    "composition:text-beside-art": P(5, 5, 26, 36) + L(35, 12, 22) + L(35, 18, 20) + L(35, 24, 22) + L(35, 30, 14),
    "composition:text-mostly": L(7, 7, 50) + L(7, 13, 46) + L(7, 19, 50) + L(7, 25, 40) + L(7, 31, 48) + L(7, 37, 30),
    "genre:story": P(5, 5, 54, 24) + L(8, 33, 48) + L(8, 38, 34),
    "genre:textbook": `<rect x="7" y="7" width="22" height="5" rx="1.5" fill="currentColor" opacity=".6"/>` + L(7, 16, 48) + L(7, 22, 40) + box(7, 29) + `<rect x="17" y="33" width="34" height="1.5" fill="currentColor" opacity=".7"/>`,
    "genre:reference": L(7, 7, 22) + L(7, 13, 22) + L(7, 19, 22) + L(7, 25, 22) + L(35, 7, 22) + L(35, 13, 22) + `<rect x="35" y="19" width="22" height="18" rx="2" fill="none" stroke="currentColor" opacity=".55"/>`,
    "exercises:none": L(7, 9, 50) + L(7, 15, 46) + L(7, 21, 50) + L(7, 27, 40) + L(7, 33, 46),
    "exercises:some": L(7, 9, 50) + L(7, 15, 46) + L(7, 21, 40) + box(7, 29) + `<rect x="17" y="34" width="30" height="1.5" fill="currentColor" opacity=".7"/>`,
    "exercises:many": [8, 19, 30].map((y) => box(7, y) + `<rect x="17" y="${y + 5}" width="38" height="1.5" fill="currentColor" opacity=".7"/>`).join(""),
    "diagrams:none": P(8, 6, 48, 34),
    "diagrams:some": L(7, 8, 50) + L(7, 14, 40) + `<circle cx="22" cy="31" r="8" fill="none" stroke="currentColor" opacity=".6"/><path d="M30 31h10" stroke="currentColor" opacity=".6"/>` + L(42, 30, 14),
    "diagrams:many": `<circle cx="17" cy="15" r="7" fill="none" stroke="currentColor" opacity=".6"/><path d="M24 15h8" stroke="currentColor" opacity=".6"/>` + L(34, 14, 20) + `<rect x="10" y="27" width="6" height="12" fill="currentColor" opacity=".4"/><rect x="19" y="31" width="6" height="8" fill="currentColor" opacity=".4"/><rect x="28" y="24" width="6" height="15" fill="currentColor" opacity=".4"/>` + L(40, 30, 16),
  }
  return `<svg class="sk" viewBox="0 0 64 46" aria-hidden="true"><rect x="1" y="1" width="62" height="44" rx="5" fill="none" stroke="currentColor" opacity=".35"/>${m[`${fact}:${v}`] || ""}</svg>`
}
const lockIco = (s = 12) => ICON.lock.replace("<svg", `<svg width="${s}" height="${s}" style="vertical-align:-2px"`)

/* ---------- state ---------- */
let book, stage, ans, told, conflictsDone, step, walkEdit, keep, slow, long

const guessP = (k) => book.facts[k].proposed          // page-by-page reading (E5)
const guessW = (k) => book.facts[k].secondReading ?? guessP(k)  // whole-book reading (E4)
const frontOnly = () => book.coverage.onlyFrontMatter
const split = (k) => guessP(k) !== guessW(k)
const userSaid = (k) => ans[k] ?? told[k]

function factsNow() { const f = {}; for (const k of ORDER) f[k] = userSaid(k) ?? guessP(k); return f }
function valuesFor(k, f) { return Object.fromEntries(Object.keys(F[k].opts).map((o) => [o, decide(book.measured, { ...f, [k]: o })])) }
/* settings whose value differs between the options of this fact */
function variesFor(k, f) {
  const v = valuesFor(k, f), keys = Object.keys(S)
  return keys.filter((s) => new Set(Object.values(v).map((d) => d[s].value)).size > 1)
}
const matters = (k, f) => variesFor(k, f).length > 0

/* The asking rule (round 2, confirmed by the dev on 54 run pairs):
   ask a fact if another answer would change a setting AND (our two guesses differ OR we only saw opening pages).
   Facts already answered by a question stay in the list so the count does not jump. */
function toAsk() {
  const f = factsNow(), out = []
  for (const k of ORDER) {
    if (k in ans) { out.push(k); continue }
    if (k in told) continue
    if (!matters(k, f)) continue
    if (FLOW === "teach" || split(k) || frontOnly()) out.push(k)
  }
  return out
}
const unsureFact = (k) => split(k) || frontOnly()
const pendingLocked = () => toAsk().includes("diagrams") && !("diagrams" in ans) && unsureFact("diagrams")

/* conflicts between what the user told us (tell flow) and the pages */
function conflicts() {
  return Object.keys(told).filter((k) => !frontOnly() && guessP(k) !== told[k] && guessW(k) !== told[k])
}

/* ---------- pages ---------- */
const labelOf = (p) => { const t = (book.pageLabels.find((x) => x.page === p) || {}).type || "cover"; return p === 1 && !BODY(t) ? "cover" : t }
const fmtPages = (arr) => { const s = [...arr].sort((a, b) => a - b), out = []; for (let i = 0; i < s.length; i++) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(i === j ? `${s[i]}` : `${s[i]}–${s[j]}`); i = j } return out.join(", ") }
const allPages = () => Array.from({ length: book.pageCount }, (_, i) => i + 1)
function suggestedPages() {
  const body = book.coverage.bodyPages
  if (!body.length) return null
  const s = [1, ...body.filter((p) => p !== 1)]
  return s.length === book.pageCount ? null : s
}
const kept = () => keep || allPages()
const PLURAL = { "front-matter": "opening pages", "back-matter": "end pages", blank: "blank pages", cover: "cover" }
const skipPhrase = (pages) => [...new Set(pages.map((p) => PLURAL[labelOf(p)] || PAGE[labelOf(p)].toLowerCase() + " pages"))].join(" and ")

function pageStrip(opts = {}) {
  const out = []
  for (const p of allPages()) {
    const t = labelOf(p), front = ["front-matter", "back-matter", "blank"].includes(t)
    const off = !kept().includes(p)
    out.push(`<figure class="${off ? "off" : opts.flag && front ? "front" : ""}"><button data-zoom="${p}" aria-label="Open page ${p}"><img src="${img(book, p)}" alt="" loading="lazy"></button><figcaption>${opts.noLabels ? p : `${p} · ${PAGE[t] || t}`}</figcaption></figure>`)
  }
  return `<div class="strip">${out.join("")}</div>`
}
/* Sketch for long books: ~12 sampled pages + a bar of the whole book. Page labels here are made up (no whole book in the test set). */
function longStrip() {
  const n = 200, read = [1, 4, 12, 30, 55, 80, 105, 130, 155, 180, 197, 200]
  const lab = (p) => p <= 6 ? "Opening" : p >= 196 ? "End pages" : "Story"
  const figs = read.map((p, i) => `${i && read[i - 1] + 1 < p ? '<span class="gap">…</span>' : ""}<figure class="${p <= 6 || p >= 196 ? "front" : ""}"><div style="width:58px;height:80px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2)"></div><figcaption>${p} · ${lab(p)}</figcaption></figure>`).join("")
  return `<div class="strip">${figs}</div><div class="pagebar" aria-label="Where in the book we looked">${Array.from({ length: n }, (_, i) => `<i class="${read.includes(i + 1) ? "read" + (i < 6 || i >= 195 ? " front" : "") : ""}"></i>`).join("")}</div><p class="tiny faint" style="margin-top:4px">Layout sketch for a 200-page book. Page labels are made up: there is no whole book in the test set yet.</p>`
}

/* ---------- layout pictures (built from a real middle page; a sketch when we never saw one) ---------- */
function bodyPage() {
  const L = book.pageLabels.filter((x) => BODY(x.type))
  const mid = L.filter((x) => x.textPlacement !== "text-only")
  const pool = mid.length ? mid : L
  return pool.length ? pool[Math.floor(pool.length / 2)].page : null
}
function device(v, opts = {}) {
  const p = bodyPage(), im = p ? img(book, p) : null, sm = opts.small ? "sm" : ""
  const ln = (w) => `<div class="ln" style="width:${w}%"></div>`
  const pic = (cls = "pic") => im ? `<img class="${cls}" src="${im}" alt="">` : `<div class="ph"></div>`
  const pairs = spreadPairs(book)[0]
  const spread = opts.spread && pairs, widePages = book.measured.pageStorage.value === "spreads-as-wide-pages"
  switch (v) {
    case "fixed_layout": return `<div class="device ${sm} ${spread || widePages ? "wide" : ""}"><div class="fit">${spread ? `<img src="${img(book, pairs[0])}" alt="" style="width:50%"><img src="${img(book, pairs[1])}" alt="" style="width:50%">` : im ? `<img src="${im}" alt="">` : '<div class="ph" style="height:100%;width:100%"></div>'}</div></div>`
    case "two_column_story": return `<div class="device ${sm} wide"><div class="two">${im ? `<img src="${im}" alt="">` : '<div class="ph" style="width:50%;height:100%"></div>'}<div>${ln(90)}${ln(80)}${ln(95)}${ln(60)}</div></div></div>`
    case "llm": return `<div class="device ${sm}"><div class="hd"></div>${ln(95)}${ln(80)}${pic()}<div class="box">${ln(90)}${ln(70)}</div>${ln(92)}${ln(85)}</div>`
    case "single_column": return `<div class="device ${sm}"><div class="col"><div class="hd" style="width:90%"></div>${ln(100)}${ln(96)}${ln(100)}${ln(94)}${ln(100)}${ln(90)}${ln(100)}${ln(70)}</div></div>`
    case "llm-overlay": return `<div class="device ${sm}"><div class="fit">${im ? `<img src="${im}" alt="">` : ""}</div></div>`
  }
  return ""
}
const LAYOUT_SAY = {
  fixed_layout: "Your pages look as printed. The words stay on the picture, and can still be read aloud.",
  two_column_story: "The picture on one side and the words on the other. Words can be made bigger and read aloud.",
  llm: "The same words and pictures, arranged again so they fit any screen. Headings, boxes and pictures keep their order.",
  single_column: "One long column of text, like an article on a website. Figures sit between paragraphs.",
  "llm-overlay": "The picture stays, and the words are redrawn on it as real text.",
}
function layoutPreview(v, spread) {
  const mostlyWords = factsNow().composition === "text-mostly" && ["llm", "single_column"].includes(v)
  return `<div class="preview">${device(v, { spread })}<p>${LAYOUT_SAY[v]}${!bodyPage() ? " <i>(Sketch: we never saw a page of the book itself.)</i>" : ""}${mostlyWords ? " <br><span class=\"faint\">For a book that is mostly words, “Rebuilt” and “One column” look almost the same.</span>" : ""}</p></div>`
}

/* ---------- facing pages, said plainly ---------- */
function facing(st) {
  const m = book.measured.pageStorage
  if (m.value === "spreads-as-wide-pages") return { v: "Already side by side", ev: "Your PDF already has both pages side by side on each sheet, so each PDF page becomes one screen. Nothing to join." }
  if (m.value === "spreads-as-separate-pages") return { v: "Joined into one screen", ev: `We measured it: pictures run across ${m.detail.split(" of ")[0]} of ${m.detail.split(" of ")[1].split(" ")[0]} facing pairs, so each pair is shown together.` }
  return { v: "One page per screen", ev: "We measured it: no picture runs across two pages." }
}

/* ---------- option card ---------- */
function effects(k, o, f) {
  const vals = valuesFor(k, f)[o], vary = variesFor(k, f)
  if (!vary.length) return `<span>Changes nothing for this book</span>`
  return vary.map((s) => `<span>${S[s].locked ? lockIco(11) + " " : ""}${S[s].name}: <b>${S[s].vals[vals[s].value]}</b></span>`).join("")
}
function optCard(k, o, f, picked, tag) {
  const v = valuesFor(k, f)[o], showMini = variesFor(k, f).includes("renderStrategy")
  return `<button class="opt" aria-pressed="${picked}" data-ans="${k}:${o}">${tag ? `<span class="tag">${tag}</span>` : ""}${sk(k, o)}<b>${F[k].opts[o]}</b><span class="d">${optDesc(k, o)}</span>${showMini ? `<span class="mini">${device(v.renderStrategy.value, { small: true })}</span>` : ""}<span class="eff">${effects(k, o, f)}</span></button>`
}
function reasonFor(k) {
  const P = F[k].opts[guessP(k)].toLowerCase(), W = F[k].opts[guessW(k)].toLowerCase()
  if (frontOnly()) return k === ORDER.find((x) => toAsk().includes(x))
    ? `${book.coverage.say.replace("The book itself is not in this file, so the answers below are guesses.", "").replace("pages read are", "pages we read are")} <b>We couldn't see the book itself.</b> ${book.coverage.question}`
    : `This answer also comes from the opening pages only.${split(k) ? ` Our two guesses: <b>${P}</b> or <b>${W}</b>.` : ""}`
  if (split(k)) return `Looking page by page we'd say <b>${P}</b>. Looking at the book as a whole we'd say <b>${W}</b>.`
  return ""
}
function questionCard(k, i, qs, opts = {}) {
  const f = factsNow(), sure = !unsureFact(k)
  const pre = k in ans ? ans[k] : sure ? f[k] : null
  const tagOf = (o) => split(k) ? (o === guessP(k) || o === guessW(k) ? "One of our guesses" : "") : (o === f[k] ? (frontOnly() ? "Our guess (opening pages only)" : "Our guess") : "")
  const lockedQ = F[k].locked
  const r = reasonFor(k)
  const skipVal = guessP(k)
  return `<div class="qcard ${lockedQ ? "lockq" : sure ? "calm" : ""}">
    <div class="qtop"><span>${opts.label || `Question ${i + 1} of ${qs.length}`}${lockedQ ? ` · ${lockIco(12)} can't change after import` : ""}</span><span class="dots">${qs.map((x, j) => `<i class="${x in ans ? "done" : j === i ? "on" : ""}"></i>`).join("")}</span></div>
    <div class="qbody">
      ${r ? `<p class="why">${r}</p>` : ""}
      ${!sure && k === "genre" ? `<div style="margin-top:10px">${pageStrip({ flag: true })}</div>` : ""}
      ${FLOW === "teach" ? `<p class="teach">${TEACH[k]}</p>` : ""}
      <h2>${q(k)}</h2>${F[k].help ? `<p class="help">${F[k].help}</p>` : ""}
      <div class="opts">${Object.keys(F[k].opts).map((o) => optCard(k, o, f, pre === o, tagOf(o))).join("")}</div>
      <div class="qfoot"><button class="btn ghost small" data-back ${i === 0 ? "hidden" : ""}>Back</button>${sure ? `<button class="btn primary small" data-ans="${k}:${f[k]}">Yes, “${F[k].opts[f[k]]}” is right</button>` : lockedQ ? `<span class="row wrapflex" style="gap:8px"><span class="small muted">Not sure? We'll keep any labelled drawings whole, which is safe either way.</span><button class="btn small" data-ans="${k}:some">Do that</button></span>` : `<button class="btn small" data-ans="${k}:${skipVal}">I'm not sure. Use “${F[k].opts[skipVal]}”</button>`}</div>
    </div></div>`
}

/* ---------- fact rows ---------- */
function factRows() {
  const f = factsNow(), guess = frontOnly()
  return `<div class="facts">${ORDER.map((k) => {
    const v = f[k], you = userSaid(k) != null
    const cited = (book.facts[k].citedPages || []).slice(0, 4)
    const src = you ? "Your answer" : guess ? "A guess from the opening pages only" : split(k) ? `Our two guesses differ, but either gives the same settings` : `${v === "none" ? "Looked at" : "Seen on"} page${cited.length > 1 ? "s" : ""} ${cited.join(", ") || "–"}`
    const note = k === "exercises" && v === "none" && book.id.includes("colouring") ? `<div class="note">Colouring pages don't count as exercises, so no activities are made from them.</div>` : ""
    const open = walkEdit === k
    return `<div class="fact ${guess && !you ? "guess" : ""}">${sk(k, v)}<div class="q">${F[k].short}${F[k].locked ? " " + lockIco(11) : ""}</div><button class="chg" data-edit="${k}">${open ? "Done" : "Change"}</button><div class="a">${F[k].opts[v]}${you ? '<span class="you">you said</span>' : ""}</div><div></div><div class="src">${src}</div>${note}${open ? `<div class="pick">${Object.keys(F[k].opts).map((o) => `<button class="chip" aria-pressed="${o === v}" data-set="${k}:${o}">${F[k].opts[o]}</button>`).join("")}</div><div class="note">${q(k)}</div>` : ""}</div>`
  }).join("")}</div>`
}

/* ---------- side panel ---------- */
function lockBox(st, f) {

  const k = kept(), left = allPages().filter((p) => !k.includes(p)), sug = suggestedPages()
  const leftSay = left.length ? `Leaves out ${left.length === 1 ? "page" : "pages"} ${fmtPages(left)} (${skipPhrase(left)}).` : sug ? `Includes the cover and the ${skipPhrase(allPages().filter((p) => !sug.includes(p)))}.` : frontOnly() ? "We couldn't find where the book starts: every page looks like an opening page." : "Includes the cover."
  return `<section class="locked" aria-label="Can't change after import">
    <div class="locked-head">${ICON.lock}<div><h3>Can't change after import</h3><p class="small">To change these later you would have to add the book again.</p></div></div>
    <div class="lockitem"><div class="k">${S.pageGrouping.name}</div><div class="v">${fp.v}</div><div class="ev">${fp.ev}</div>${pairs.length || book.measured.pageStorage.value === "spreads-as-wide-pages" ? `<div class="thumbs" style="margin-top:6px">${pairs.length ? `<button class="spreadpair" data-zoom="${pairs[0][0]}"><img src="${img(book, pairs[0][0])}" alt="" style="height:56px"><img src="${img(book, pairs[0][1])}" alt="" style="height:56px"></button>` : `<button class="thumb" data-zoom="${bodyPage()}"><img src="${img(book, bodyPage())}" alt="" style="height:56px"></button>`}</div>` : ""}</div>
    <div class="lockitem"><div class="k">${S.figureExtraction.name}</div>${dgPending ? `<div class="v pending">Waiting for your answer</div>` : `<div class="v">${S.figureExtraction.vals[st.figureExtraction.value]}</div>`}<div class="ev">${dg}</div>${dgPending ? "" : `<button class="lnk" data-edit-lock="diagrams">This is wrong</button>`}</div>
    <div class="lockitem"><div class="k">Pages to import</div><div class="v">${left.length ? `${k.length} of ${book.pageCount}: ${fmtPages(k)}` : `All ${book.pageCount} pages`}</div><div class="ev">${leftSay}</div>${sug && !keep ? `<div class="ev" style="margin-top:6px">Suggestion: keep the cover, skip the ${skipPhrase(allPages().filter((p) => !sug.includes(p)))}. <button class="lnk acc" data-use-sugg>Use it</button></div>` : ""}<button class="lnk" data-range>Choose pages</button></div>
  </section>`
}
function laterBox(st) {

    <div class="row" style="justify-content:space-between;padding:12px 16px 0"><h3>What you'll get</h3>${laterBadge()}</div>
    <div class="later">
      <div class="setting"><div><div class="name">${S.renderStrategy.name}</div><div class="val">${S.renderStrategy.vals[st.renderStrategy.value]}</div></div><div></div><div class="why" style="grid-column:1/-1">${layoutPreview(st.renderStrategy.value, spread)}</div></div>
      <div class="setting"><div><div class="name">${S.activitiesGenerator.name}</div><div class="val">${S.activitiesGenerator.vals[st.activitiesGenerator.value]}</div></div><div></div><div class="why">${st.activitiesGenerator.rule}</div></div>
      <details class="more"><summary>2 more settings</summary>

        <div class="setting"><div><div class="name">${S.sectioningMode.name}</div><div class="val">${S.sectioningMode.vals[st.sectioningMode.value]}</div></div></div>
      </details>

/* ---------- loader ---------- */
function tellCard() {
  const f = ["genre", "composition"]
  return `<div class="wait tell"><h3>While we read: tell us what you know</h3><p class="small muted">You know the whole book; we only see some pages. Two taps, or skip. We'll tell you if the pages look different.</p>
    ${f.map((k) => `<p class="small" style="margin-top:12px;font-weight:600">${q(k)}</p><div class="row wrapflex" style="margin-top:6px">${Object.keys(F[k].opts).map((o) => `<button class="chip" aria-pressed="${told[k] === o}" data-tell="${k}:${o}">${F[k].opts[o]}</button>`).join("")}<button class="chip" aria-pressed="${told[k] === undefined ? "false" : "false"}" data-tell="${k}:">Not sure</button></div>`).join("")}
    ${told.genre === "textbook" ? `<p class="small" style="margin-top:12px;font-weight:600">${q("exercises")}</p><div class="row wrapflex" style="margin-top:6px">${Object.keys(F.exercises.opts).map((o) => `<button class="chip" aria-pressed="${told.exercises === o}" data-tell="exercises:${o}">${F.exercises.opts[o]}</button>`).join("")}</div>` : ""}
  </div>`

function renderLoader() {
  const m = book.measured, t = +(params().get("t") ?? 99)

  const fp = facing()
  $("#app").innerHTML = `<div class="wrap"><div class="load">
    <div class="bookhead"><img src="${img(book, 1)}" alt=""><div><h1>${esc(book.title)}</h1><p class="muted small">${long ? 200 : book.pageCount} pages · ${langName(m.language.guess)}</p></div></div>

        <p class="small muted">${long ? "For long books we look at about 12 pages, spread from start to end." : `We look at all ${book.pageCount} pages.`}</p><div style="margin-top:8px">${long ? longStrip() : pageStrip({ flag: done2, noLabels: !done2 })}</div></div></div>
    </div>
    ${slow && !done2 ? `<div class="slow">This is taking longer than usual. Nothing is lost: the settings that can't change are already measured, and you can answer below or choose pages while you wait.</div>` : ""}
    ${FLOW === "tell" ? tellCard() : FLOW === "check" ? `<div class="wait"><h3>While you wait: what kind of book is it?</h3><p class="small muted">Optional. You know the whole book; we only see some pages.</p>
      <div class="row wrapflex" style="margin-top:10px">${Object.keys(F.genre.opts).map((o) => `<button class="chip" aria-pressed="${told.genre === o}" data-tell="genre:${o}">${F.genre.opts[o]}</button>`).join("")}</div></div>` : ""}
    <p class="small muted" style="margin-top:12px">Does the book start later than page 1, or have pages you don't want? <button class="lnk acc" data-range>Choose pages</button></p>
  </div></div>`
  $("#dock").hidden = false
  $("#dock").innerHTML = `<div class="wrap"><span class="small muted">${done2 ? "Done reading." : "Reading…"}</span><button class="btn primary" data-go="result" ${done2 ? "" : "disabled"}>See what we found</button></div>`
}

/* ---------- result ---------- */
function statusLine(qs, next) {
  const left = qs.filter((k) => !(k in ans)).length
  const said = Object.keys(told).filter((k) => told[k])
  if (FLOW === "tell") {
    const cf = conflicts().filter((k) => !(k in conflictsDone))
    if (cf.length) return `<div class="status unsure">${ICON.flag}<p><b>The pages look different from what you told us.</b> Please check ${cf.length === 1 ? "this one" : "these"}.</p></div>`
  }
  if (next && FLOW === "teach") return `<div class="status calm">${ICON.check}<p>Here's how we'll make this book, one thing at a time. Where we're sure, our guess is already picked.</p></div>`
  if (next) return `<div class="status unsure">${ICON.flag}<p><b>We're not sure about this book.</b> ${left === 1 ? (qs.length > 1 ? "One last question" : "One question") : `${left} questions`}, then you're done.${pendingLocked() ? (left === 1 ? " It can't be changed after import." : " One of them can't be changed after import.") : ""}</p></div>`
  if (Object.keys(ans).length) return `<div class="status calm">${ICON.check}<p><b>Thanks, that's everything.</b> Check the summary and create the book.</p></div>`
  if (said.length) {
    const g = told.genre
    if (g && guessP("genre") !== g && guessW("genre") !== g && !frontOnly()) return `<div class="status unsure">${ICON.flag}<p>You said <b>${F.genre.opts[g].toLowerCase()}</b>. Both our guesses were different (${F.genre.opts[guessP("genre")].toLowerCase()}${split("genre") ? `, ${F.genre.opts[guessW("genre")].toLowerCase()}` : ""}). We went with you; please check the summary.</p></div>`
    if (g && split("genre") && !frontOnly()) return `<div class="status calm">${ICON.check}<p>You said <b>${F.genre.opts[g].toLowerCase()}</b>. Our two guesses were split, and one agreed with you. We went with you.</p></div>`
    if (frontOnly()) return `<div class="status calm">${ICON.check}<p><b>We used your answers.</b> We only saw the opening pages, so we couldn't check them against the book.</p></div>`
    return `<div class="status calm">${ICON.check}<p><b>Matches what we saw.</b> Here's the summary.</p></div>`
  }
  return `<div class="status calm">${ICON.check}<p><b>Looks right.</b> Here's what we found.</p></div>`
}
function conflictCard(k) {
  const cites = (book.facts[k].citedPages || []).slice(0, 5)
  return `<div class="qcard"><div class="qtop"><span>You said one thing, the pages say another</span></div><div class="qbody">
    <div class="vs"><div><div class="k">You said</div><b>${F[k].opts[told[k]]}</b></div><div><div class="k">The pages we read look like</div><b>${F[k].opts[guessP(k)]}</b>${split(k) ? ` <span class="small muted">or ${F[k].opts[guessW(k)].toLowerCase()}</span>` : ""}</div></div>
    ${cites.length ? `<div style="margin-top:10px">${thumbs(book, cites, cites)}</div>` : ""}
    <h2>${q(k)}</h2>
    <div class="opts">${[told[k], guessP(k)].map((o, i) => optCard(k, o, factsNow(), false, i === 0 ? "You said" : "The pages say").replace(`data-ans="${k}:${o}"`, `data-conf="${k}:${o}"`)).join("")}</div>
  </div></div>`
}
function renderResult() {
  const f0 = factsNow()
  let qs = toAsk(), next = qs.find((k) => !(k in ans))
  if (FLOW === "teach" && step != null && step >= 0) next = qs[step] && !(qs[step] in ans) ? qs[step] : next
  const cf = FLOW === "tell" ? conflicts().filter((k) => !(k in conflictsDone)) : []
  const st = decide(book.measured, f0)
  let main = ""
  if (cf.length) main = `<section class="sec">${conflictCard(cf[0])}</section>`
  else if (next) main = `<section class="sec">${questionCard(next, qs.indexOf(next), qs, FLOW === "teach" ? { label: `Step ${qs.indexOf(next) + 1} of ${qs.length}` } : {})}${FLOW === "teach" ? `<p class="small muted" style="margin-top:10px">${qs.filter((k) => !(k in ans) && !unsureFact(k)).length > 1 ? `<button class="btn small" data-skip-sure>Use your guesses for the ones you're sure about</button>` : ""}</p>` : ""}</section>`
  else main = `<section class="sec"><div class="sec-h"><h2>About this book</h2></div>${factRows()}</section>`
  const t3 = frontOnly() ? "A guess: we only saw the opening pages" : ""
  $("#app").innerHTML = `<div class="wrap layout">
    <div style="min-width:0">
      <div class="bookhead"><img src="${img(book, 1)}" alt=""><div><h1>${esc(book.title)}</h1><p class="muted small">${book.pageCount} pages · ${langName(book.measured.language.guess)} · ${book.measured.textLayer.value === "digital" ? "real text" : "scanned"}</p></div></div>
      ${statusLine(qs, next || cf.length)}
      ${main}
      <section class="sec"><div class="sec-h"><h2>Pages we looked at</h2><button class="btn ghost small" data-range>Choose pages to import</button></div>${pageStrip({ flag: true })}${t3 ? `<p class="small" style="color:var(--flag)">${t3}</p>` : ""}</section>
      ${testerKey()}
    </div>
    <aside class="panel">${lockBox(st, f0)}${laterBox(st)}</aside>
  </div>`
  const left = qs.filter((k) => !(k in ans)).length + cf.length
  $("#dock").hidden = false
  $("#dock").innerHTML = `<div class="wrap"><span class="small muted">${left ? `${left} question${left === 1 ? "" : "s"} left${pendingLocked() ? ", one can't change later" : ""}` : `<span class="row" style="gap:6px">${lockIco(14)} 3 things can't change after this</span>`}</span><button class="btn primary" data-create ${left ? "disabled" : ""}>Create book</button></div>`
}
function testerKey() {
  const f = factsNow()
  const rows = ORDER.map((k) => { const t = book.facts[k].trueAnswer || [], okP = t.includes(guessP(k)), okW = t.includes(guessW(k)), okNow = t.includes(f[k])
    return `<tr><td>${F[k].short}</td><td>${t.map((x) => F[k].opts[x]).join(" or ")}</td><td class="${okP ? "ok" : "bad"}">${F[k].opts[guessP(k)]}</td><td class="${okW ? "ok" : "bad"}">${F[k].opts[guessW(k)]}</td><td class="${okNow ? "ok" : "bad"}">${F[k].opts[f[k]]}</td></tr>` }).join("")
  const ar = book.askAcrossRuns
  return `<details class="key"><summary>For testers: real AI answers and the answer key</summary>
    <table><tr><td></td><td><b>Right answer</b></td><td><b>Page by page</b></td><td><b>Whole book</b></td><td><b>Used now</b></td></tr>${rows}</table>
    <p style="margin-top:6px">Source: prototypes/data (E5 page labels run 1 proposes, E4 one call run 1 checks; gpt-5.4-mini). ${ar ? `Across ${ar.combos} run pairs this book got ${[...new Set(ar.questions)].join(" or ")} question${ar.avgQuestions === 1 ? "" : "s"}; wrong settings let through: ${Object.keys(ar.missed || {}).length}.` : ""}</p></details>`
}

function render() {
  $("#flowname").textContent = FLOWS[FLOW][0]
  $("#flows").innerHTML = Object.entries(FLOWS).map(([k, [n, dir]]) => `<a href="../${dir}/index.html?book=${book.id}" ${k === FLOW ? 'aria-current="page"' : ""}>${n}</a>`).join("") + `<a href="../index.html">All prototypes</a>`
  $("#books").innerHTML = DATA.books.map((b) => `<button class="bookbtn" aria-pressed="${b.id === book.id}" data-book="${b.id}"><img src="${img(b, 1)}" alt="">${esc(b.short)}${b.ask.length ? '<span class="wrongdot" title="We ask a question on this book"></span>' : ""}</button>`).join("")
  stage === "reading" ? renderLoader() : renderResult()
}

/* ---------- dialogs ---------- */
function createDialog() {
  const st = decide(book.measured, factsNow()), k = kept()
  $("#dlg").innerHTML = `<div class="dlg"><h2>Create the book?</h2><p class="muted small" style="margin-top:6px">These three can't be changed after import:</p>
    <ul class="small" style="padding-left:18px"><li>${S.pageGrouping.name}: <b>${facing(st).v}</b></li><li>${S.figureExtraction.name}: <b>${S.figureExtraction.vals[st.figureExtraction.value]}</b></li><li>Pages: <b>${k.length === book.pageCount ? `all ${book.pageCount}` : `${k.length} of ${book.pageCount} (${fmtPages(k)})`}</b></li></ul>
    <p class="muted small">Everything else can be changed later.</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-close>Back</button><button class="btn primary" data-close>Create book</button></div></div>`
  $("#dlg").showModal()
}
let draft
function rangeDialog() {
  draft = draft || [...kept()]
  const sug = suggestedPages()
  const left = allPages().filter((p) => !draft.includes(p))
  $("#dlg").innerHTML = `<div class="dlg"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2>Choose pages to import</h2>${lockBadge("Can't change after import")}</div>
    ${sug ? `<div class="sugg"><span>The book seems to start on page ${book.coverage.contentStartsAt}. Keep the cover, skip the ${skipPhrase(allPages().filter((p) => !sug.includes(p)))}?</span><button class="btn small" data-draft="sugg">Use this</button></div>` : frontOnly() ? `<div class="sugg" style="background:var(--flag-soft)"><span>Every page here looks like an opening page, so we can't suggest where the book starts. Is this the right file?</span></div>` : ""}
    <p class="small muted" style="margin-top:12px">Tap a page to leave it out or put it back.</p>
    <div class="pickgrid">${allPages().map((p) => `<button class="pg ${draft.includes(p) ? "" : "out"}" data-toggle="${p}" aria-pressed="${draft.includes(p)}"><span class="tick">${ICON.check}</span><img src="${img(book, p)}" alt=""><span class="lab">${p} · ${PAGE[labelOf(p)]}</span></button>`).join("")}</div>
    <div class="row wrapflex small" style="margin-top:12px"><button class="btn ghost small" data-draft="all">Keep all</button><span>or from page <input type="number" id="rf" min="1" max="${book.pageCount}" value="${Math.min(...draft)}"> to <input type="number" id="rt" min="1" max="${book.pageCount}" value="${Math.max(...draft)}"></span><label class="row" style="gap:4px"><input type="checkbox" id="rc" ${draft.includes(1) ? "checked" : ""}> keep the cover</label><button class="btn small" data-draft="range">Apply</button></div>
    <p class="small" style="margin-top:10px"><b>${draft.length} of ${book.pageCount} pages</b>${left.length ? `, leaving out ${left.length === 1 ? "page" : "pages"} ${fmtPages(left)}` : ""}.</p>
    <p class="warn">Pages you leave out are not imported, and can't be added back without adding the book again.</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" data-range-ok ${draft.length ? "" : "disabled"}>Use these pages</button></div></div>`
  if (!$("#dlg").open) $("#dlg").showModal()
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button")
  if (!t) return
  const ds = t.dataset
  if (ds.book) { pick(ds.book); return }
  if (ds.tell !== undefined) { const [k, v] = ds.tell.split(":"); if (!v || told[k] === v) delete told[k]; else told[k] = v; if (k === "genre" && told.genre !== "textbook") delete told.exercises; syncState(); render(); return }
  if (ds.go) { stage = "result"; setParam("stage", null); setParam("t", null); render(); scrollTo(0, 0); return }
  if (ds.ans) { const [k, v] = ds.ans.split(":"); ans[k] = v; step = null; syncState(); render(); return }
  if (ds.conf) { const [k, v] = ds.conf.split(":"); conflictsDone[k] = v; told[k] = v; syncState(); render(); return }
  if ("skipSure" in ds) { for (const k of toAsk()) if (!(k in ans) && !unsureFact(k)) ans[k] = factsNow()[k]; syncState(); render(); return }
  if ("back" in ds) { const qs = toAsk(); const last = [...qs].reverse().find((k) => k in ans); if (last) delete ans[last]; syncState(); render(); return }
  if (ds.edit) { walkEdit = walkEdit === ds.edit ? null : ds.edit; render(); return }
  if (ds.editLock) { walkEdit = "diagrams"; render(); document.querySelector('[data-edit="diagrams"]')?.scrollIntoView({ block: "center" }); return }
  if (ds.set) { const [k, v] = ds.set.split(":"); ans[k] = v; syncState(); render(); return }
  if ("useSugg" in ds) { keep = suggestedPages(); syncState(); render(); return }
  if ("range" in ds) { draft = null; rangeDialog(); return }
  if (ds.toggle) { const p = +ds.toggle; draft = draft.includes(p) ? draft.filter((x) => x !== p) : [...draft, p].sort((a, b) => a - b); rangeDialog(); return }
  if (ds.draft) {
    if (ds.draft === "all") draft = allPages()
    if (ds.draft === "sugg") draft = suggestedPages()
    if (ds.draft === "range") { const a = +$("#rf").value, b = +$("#rt").value; draft = allPages().filter((p) => (p >= a && p <= b) || (p === 1 && $("#rc").checked)) }
    rangeDialog(); return
  }
  if ("rangeOk" in ds) { keep = draft.length === book.pageCount ? null : draft; draft = null; syncState(); $("#dlg").close(); render(); return }
  if ("create" in ds) { createDialog(); return }
  if ("close" in ds) { draft = null; $("#dlg").close(); return }
})
const enc = (o) => Object.entries(o).map(([k, v]) => `${k}:${v}`).join(",") || null
function syncState() { setParam("a", enc(ans)); setParam("told", enc(told)); setParam("conf", enc(conflictsDone)); setParam("pages", keep ? fmtPages(keep).replace(/ /g, "") : null) }
const dec = (s) => Object.fromEntries((s || "").split(",").filter(Boolean).map((x) => x.split(":")))
const decPages = (s) => s ? s.split(",").flatMap((r) => { const [a, b] = r.split(/[–-]/).map(Number); return b ? Array.from({ length: b - a + 1 }, (_, i) => a + i) : [a] }) : null

function pick(id) { book = bookById(id); ans = {}; told = {}; conflictsDone = {}; walkEdit = null; keep = null; step = null; ["a", "told", "conf", "pages", "edit", "dialog"].forEach((k) => setParam(k, null)); setParam("book", id); stage = FLOW === "tell" ? "reading" : "result"; setParam("stage", stage === "reading" ? "reading" : null); render() }

function init() {
  const p = params()
  book = bookById(p.get("book") || DATA.books[0].id)
  stage = p.get("stage") || "result"
  ans = dec(p.get("a")); told = dec(p.get("told")); conflictsDone = dec(p.get("conf"))
  walkEdit = p.get("edit"); keep = decPages(p.get("pages")); slow = p.has("slow"); long = p.has("long")
  setupTheme(); setupLightbox(() => book); render()
  if (p.get("dialog") === "create") createDialog()
  if (p.get("dialog") === "range") { draft = p.get("draft") === "sugg" ? suggestedPages() : null; rangeDialog() }
}
init()
</script>
</body>
</html>
