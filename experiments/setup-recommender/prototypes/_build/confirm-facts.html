<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check the Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/*BASE_CSS*/
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-top:20px;padding-bottom:40px}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.bookhead{display:flex;gap:14px;align-items:center}
.bookhead img{width:64px;border-radius:6px;border:1px solid var(--line);flex:none}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:28px 0 10px}
.ask{border:1.5px solid var(--flag-line);background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.ask-head{background:var(--flag-soft);padding:12px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ask-body{padding:16px}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.readings{grid-template-columns:1fr}}
.reading{min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.reading .who{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.reading .ans{font-family:"Fraunces",serif;font-size:18px;margin:2px 0 6px}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.strip figure{margin:0;flex:none;width:52px;text-align:center}
.strip img{width:52px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.strip figcaption{font-size:10px;line-height:1.2;color:var(--ink-2);margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.opt b{display:block}
.opt span{font-size:12px;color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .tag{float:right;font-size:11px;color:var(--ink-3)}
.factrow{border-top:1px solid var(--line);padding:12px 16px}
.factrow:first-child{border-top:0}
.factrow summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;align-items:center}
.factrow summary::-webkit-details-marker{display:none}
.factrow .q{font-size:13px;color:var(--ink-2)}
.factrow .a{font-weight:600}
.factrow .a.user{color:var(--accent)}
.factrow .more{font-size:12px;color:var(--accent);white-space:nowrap}
.factrow[open] .more{visibility:hidden}
.panel{position:sticky;top:80px;align-self:start}
.panel .group{padding:4px 16px 8px}
.panel .ghead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
.lockitem{padding:12px 16px;border-top:1px solid var(--lock-line)}
.lockitem:first-of-type{border-top:0}
.lockitem select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:100%}
.agree{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--radius);background:var(--ok-soft);color:var(--ok)}
.dock{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
.dock .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,8,.5)}
.dlg{padding:20px}
.warn{color:var(--flag);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand">Add book<small>Direction A · check the AI's reading</small></div>
  <nav class="books" id="books" aria-label="Sample books"></nav>
  <button class="iconbtn" id="theme" aria-label="Toggle theme"></button>
</div></header>

<main class="wrap layout">
  <section id="left"></section>
  <aside class="panel" id="panel"></aside>
</main>

<div class="dock"><div class="wrap">
  <p class="small muted" id="dockmsg"></p>
  <div class="row"><button class="btn ghost" id="reset">Start over</button><button class="btn primary" id="create">Create book</button></div>
</div></div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<script>
/*DATA*/
/*BASE_JS*/

const state = {} // per book: { facts, answered:Set, opened, lockedOverride:{}, prev:{} }
function S(b) {
  if (!state[b.id]) state[b.id] = { facts: aiFacts(b), answered: new Set(), lockedOverride: {}, prev: null }
  return state[b.id]
}
let book = bookById(params().get("book") || DATA.books[0].id)

function settingsFor(b) {
  const st = S(b), out = decide(b.measured, st.facts)
  for (const [k, v] of Object.entries(st.lockedOverride)) out[k] = { value: v, rule: "You changed this.", user: true }
  return out
}

function render(flashFrom) {
  const st = S(book)
  const set = settingsFor(book)
  const dis = disagreements(book)
  const asks = dis.filter((d) => d.matters)
  const quiet = dis.filter((d) => !d.matters)
  const askFacts = asks.map((d) => d.fact)

  let h = `<div class="bookhead"><img src="${img(book, 1)}" alt="Cover"><div><h1>${esc(book.title)}</h1><p class="small muted">${measuredLine(book)} · read in about 4 s</p></div></div>`

  // 1. flagged facts that change a setting
  if (asks.length) {
    h += `<div class="sec-title"><h2>Check this first</h2><span class="small faint">${asks.length} of 4 answers</span></div>`
    for (const d of asks) {
      const f = FACTS[d.fact], A = book.readingA[d.fact]
      const answered = st.answered.has(d.fact)
      h += `<div class="ask" id="ask-${d.fact}">
        <div class="ask-head"><h3>${f.q}</h3>${answered ? '<span class="badge ok">' + ICON.check + 'You answered</span>' : flagBadge()}</div>
        <div class="ask-body stack">
          <p class="small muted">We read the pages two ways. They don't agree, so we'd rather ask than guess.</p>
          <div class="readings">
            <div class="reading"><div class="who">Reading the pages together</div><div class="ans">${f.opts[d.a][0]}</div><p class="small muted">“${esc(A.reason)}”</p><div style="margin-top:8px">${thumbs(book, A.evidencePages.slice(0, 4), A.evidencePages)}</div></div>
            <div class="reading"><div class="who">Labelling each page</div><div class="ans">${book.readingB.counts && book.readingB.counts.body === 0 ? "Can't tell" : f.opts[d.b][0]}</div><p class="small muted">${book.readingB.counts && book.readingB.counts.body === 0 ? "Every page is a cover, front matter or blank. No story, lesson or information pages to judge from." : "Most pages look like " + f.opts[d.b][0].toLowerCase() + "."}</p>
              <div class="strip" style="margin-top:8px">${book.readingB.pages.map((p) => `<figure><button class="thumb" data-zoom="${p.page}" style="padding:0;border:0"><img src="${img(book, p.page)}" alt="Page ${p.page}"></button><figcaption>${p.type.replace("-", " ")}</figcaption></figure>`).join("")}</div></div>
          </div>
          <p class="small"><b>Your answer decides:</b> ${unique(d.changes.concat(settingsFed(d.fact))).map((k) => SETTINGS[k].name).join(", ")}.</p>
          <div class="opts" data-fact="${d.fact}">${Object.entries(f.opts).map(([v, [l, hint]]) => `<button class="opt" data-v="${v}" aria-pressed="${answered && st.facts[d.fact] === v}"><b>${l}${v === d.a ? '<span class="tag">reading 1</span>' : ""}</b><span>${hint}</span></button>`).join("")}</div>
        </div></div>`
    }
  } else {
    h += `<div class="sec-title"><h2>The AI's reading</h2></div><div class="agree">${ICON.check}<p class="small"><b>Two readings agree on everything that matters.</b> Skim the answers below, or just create the book.</p></div>`
  }

  // 2. the other answers, collapsed
  const rest = FACT_ORDER.filter((k) => !askFacts.includes(k))
  h += `<div class="sec-title"><h2>${asks.length ? "The other answers" : "Answers"}</h2><span class="small faint">open one to check or change it</span></div><div class="card">`
  for (const k of rest) {
    const f = FACTS[k], A = book.readingA[k], v = st.facts[k], mine = v !== A.answer
    const q = quiet.find((d) => d.fact === k)
    h += `<details class="factrow" ${params().get("open") === k ? "open" : ""}><summary><span class="q">${f.q}</span><span class="more">Check</span><span class="a ${mine ? "user" : ""}">${f.opts[v][0]}${mine ? ' <span class="tiny">(you)</span>' : ""}</span><span class="tiny faint">${q ? "readings differ, same settings" : ""}</span></summary>
      <div class="stack" style="margin-top:10px"><p class="small muted">AI: “${esc(A.reason)}”</p>${thumbs(book, A.evidencePages.slice(0, 5), A.evidencePages)}
      <div class="row wrapflex" data-fact="${k}">${Object.entries(f.opts).map(([o, [l]]) => `<button class="chip" data-v="${o}" aria-pressed="${v === o}">${l}${o === A.answer ? '<span class="ai">AI</span>' : ""}</button>`).join("")}</div></div></details>`
  }
  h += `</div>`
  if (quiet.length) h += `<p class="tiny faint" style="margin-top:8px">The readings also differed on ${quiet.map((d) => FACTS[d.fact].q.toLowerCase().replace("?", "")).join(" and ")}, but either answer gives the same settings, so we don't ask.</p>`
  h += `<p class="note">Prototype. Real answers, reasons and cited pages from ${esc(DATA.source)}. The AI's own confidence is not shown: it said “high” on every wrong answer.</p>`
  $("#left").innerHTML = h

  // panel
  const was = (k) => (flashFrom && flashFrom[k] && flashFrom[k].value !== set[k].value ? `<span class="was">${SETTINGS[k].vals[flashFrom[k].value]}</span>` : "")
  let p = `<div class="locked"><div class="locked-head">${ICON.lock.replace("<svg", '<svg width="18" height="18"')}<div><h3>Fixed when you import</h3><p class="tiny">Measured from the PDF. To change these later you import the book again.</p></div></div>`
  for (const k of LOCKED) {
    const ev = lockedEvidence(book, k, st.facts)
    p += `<div class="lockitem ${flashFrom && flashFrom[k] && flashFrom[k].value !== set[k].value ? "setting flash" : ""}" style="display:block">
      <div class="small muted">${SETTINGS[k].name}</div><div style="font-weight:600">${SETTINGS[k].vals[set[k].value]}${was(k)}</div>
      <p class="tiny muted" style="margin:4px 0 8px">${esc(ev.text)}</p>${ev.html}
      <details style="margin-top:8px"><summary class="tiny" style="color:var(--lock);cursor:pointer">Change</summary>
        <select data-lock="${k}" style="margin-top:6px">${Object.entries(SETTINGS[k].vals).map(([v, l]) => `<option value="${v}" ${set[k].value === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        <p class="warn">Only change this if you know the PDF better than the measurement.</p></details></div>`
  }
  p += `</div><div class="card" style="margin-top:16px"><div class="ghead"><h3>Can change later</h3>${laterBadge("In book settings")}</div><div class="group">`
  for (const k of CHEAP) {
    const changed = flashFrom && flashFrom[k] && flashFrom[k].value !== set[k].value
    p += `<div class="setting ${changed ? "flash" : ""}"><span class="name">${SETTINGS[k].name}</span><span></span><span class="val">${SETTINGS[k].vals[set[k].value]}${was(k)}</span><span></span><span class="why">${esc(set[k].rule)}</span></div>`
  }
  p += `</div></div>`
  $("#panel").innerHTML = p

  const open = asks.filter((d) => !st.answered.has(d.fact)).length
  $("#create").disabled = open > 0
  $("#dockmsg").innerHTML = open ? `<b>${open} question</b> left. Everything else is filled in.` : `Ready. ${LOCKED.length} settings are fixed at import, ${CHEAP.length} can change later.`
  renderBookTabs(book.id, pick)
}

const unique = (a) => [...new Set(a)]
const settingsFed = (fact) => SETTING_ORDER.filter((k) => FEEDS[k].includes(fact))

function answer(fact, v) {
  const st = S(book)
  const before = settingsFor(book)
  st.facts[fact] = v
  st.answered.add(fact)
  render(before)
}

document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-fact] [data-v]")
  if (o) answer(o.closest("[data-fact]").dataset.fact, o.dataset.v)
})
document.addEventListener("change", (e) => {
  const s = e.target.closest("[data-lock]")
  if (!s) return
  const before = settingsFor(book)
  S(book).lockedOverride[s.dataset.lock] = s.value
  render(before)
})
$("#reset").onclick = () => { delete state[book.id]; render() }
$("#create").onclick = () => openCreate()

function openCreate() {
  const set = settingsFor(book)
  $("#dlgbody").innerHTML = `<h2>Create “${esc(book.title)}”?</h2>
    <div class="locked" style="margin-top:14px"><div class="locked-head">${ICON.lock.replace("<svg", '<svg width="18" height="18"')}<div><h3>These can't change after this step</h3></div></div>
    <div class="group" style="padding:4px 16px 8px">${LOCKED.map((k) => `<div class="setting"><span class="name">${SETTINGS[k].name}</span><span></span><span class="val">${SETTINGS[k].vals[set[k].value]}</span></div>`).join("")}</div></div>
    <p class="small muted" style="margin-top:12px">Preset, layout, sections and activities can be changed any time in the book's settings.</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="dlg.close()">Back</button><button class="btn primary" onclick="dlg.close();$('#dockmsg').innerHTML='<b>Created</b> (prototype). Extract would start now.'">Create book</button></div>`
  dlg.showModal()
}

function pick(id) { book = bookById(id); setParam("book", id); render() }

setupTheme()
setupLightbox(() => book)
// URL-addressable states for screenshots: ?book=…&answer=genre:story&create=1
const pre = params().get("answer")
if (pre) { const [f, v] = pre.split(":"); answer(f, v) } else render()
if (params().get("create")) openCreate()
</script>
</body>
</html>
