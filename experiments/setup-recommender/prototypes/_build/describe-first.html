<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell Us First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/*BASE_CSS*/
main{padding-top:24px;padding-bottom:80px}
.hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;align-items:start;max-width:900px;margin:0 auto}
@media (max-width:640px){.hero{grid-template-columns:1fr;gap:16px}.hero .cover{max-width:140px}}
.cover img{border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow)}
.status{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:8px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
@media (max-width:640px){.kinds{grid-template-columns:1fr}}
.kind{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.kind{flex-direction:row;align-items:center}.kind .mini{width:54px;flex:none}}
.kind b{font-size:16px}
.kind span{font-size:12px;color:var(--ink-2)}
.kind:hover{border-color:var(--ink-3)}
.mini{aspect-ratio:4/3;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mini .ln{height:4px;border-radius:2px;background:var(--ink-3);opacity:.5}
.mini .pic{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2));border-radius:3px;flex:1}
.mini .box{width:8px;height:8px;border:1.5px solid var(--ink-3);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:3px}
.say{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.say input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.result{max-width:900px;margin:0 auto}
.youSaid{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.callout{border-radius:var(--radius);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.callout.flag{background:var(--flag-soft);color:var(--ink)}
.callout.flag svg{color:var(--flag);flex:none;width:18px;height:18px;margin-top:2px}
.callout.ok{background:var(--ok-soft)}
.callout.ok svg{color:var(--ok);flex:none;width:18px;height:18px;margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.factrow{padding:12px 16px;border-top:1px solid var(--line)}
.factrow:first-child{border-top:0}
.factrow .q{font-size:13px;color:var(--ink-2)}
.group{padding:4px 16px 8px}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;gap:8px}
.lockitem{padding:10px 16px;border-top:1px solid var(--lock-line)}
.lockitem:first-of-type{border-top:0}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand">Add book<small>Direction C · you say what it is first</small></div>
  <nav class="books" id="books" aria-label="Sample books"></nav>
  <button class="iconbtn" id="theme" aria-label="Toggle theme"></button>
</div></header>

<main class="wrap" id="main"></main>

<script>
/*DATA*/
/*BASE_JS*/

let book = bookById(params().get("book") || DATA.books[0].id)
let kind = params().get("kind")   // story | textbook | reference | unsure | null
let line = params().get("line") || ""
let facts = null                  // the facts in use after step 1
let flashFrom = null

const KIND_ART = {
  story: `<div class="mini"><div class="pic"></div><div class="ln" style="width:70%"></div></div>`,
  textbook: `<div class="mini"><div class="ln"></div><div class="ln" style="width:80%"></div><div><span class="box"></span><span class="ln" style="display:inline-block;width:60%"></span></div><div><span class="box"></span><span class="ln" style="display:inline-block;width:50%"></span></div></div>`,
  reference: `<div class="mini">${'<div class="ln"></div>'.repeat(6)}<div class="ln" style="width:40%"></div></div>`,
}

function step1() {
  $("#main").innerHTML = `<div class="hero">
    <div class="cover"><img src="${img(book, 1)}" alt="Cover of ${esc(book.title)}"><div class="status"><i></i>Pages read in the background</div></div>
    <div><p class="small faint">${esc(book.title)} · ${measuredLine(book)}</p>
      <h1 style="margin-top:6px">What is this book?</h1>
      <p class="muted" style="margin-top:6px">You know the whole book. We only see a few pages. Your answer sets the preset and layout; we'll work out the rest.</p>
      <div class="kinds">${Object.entries(FACTS.genre.opts).map(([v, [l, hint]]) => `<button class="kind" data-kind="${v}">${KIND_ART[v]}<div><b>${l}</b><br><span>${hint}</span></div></button>`).join("")}</div>
      <div class="say"><input id="line" placeholder="Anything else? e.g. “a novel for teenagers, this PDF is only the first chapter” (optional)" value="${esc(line)}"></div>
      <p style="margin-top:14px"><button class="btn ghost" data-kind="unsure">I'm not sure, let the AI decide</button></p>
      <p class="note">Prototype. The one-line note is not used yet: in our tests a description given as a hint did not change the AI's answer (E3). Only the pick above replaces the AI's guess.</p>
    </div></div>`
}

function step2() {
  const A = aiFacts(book)
  if (!facts) facts = kind === "unsure" ? { ...A } : { ...A, genre: kind }
  const agrees = kind !== "unsure" && kind === A.genre
  const dis = disagreements(book).filter((d) => d.matters)
  const flaggedGenre = dis.find((d) => d.fact === "genre")
  const s = decide(book.measured, facts)

  let callout
  if (kind === "unsure" && flaggedGenre && !facts._confirmed)
    callout = `<div class="callout flag">${ICON.flag}<div><b>We can't tell from these pages.</b> Reading them together says <b>reference</b>; labelling each page found only ${readingBSummary(book)}. Pick one: <div class="row wrapflex" style="margin-top:8px" data-fact="genre">${Object.entries(FACTS.genre.opts).map(([v, [l]]) => `<button class="chip" data-v="${v}">${l}</button>`).join("")}</div></div></div>`
  else if (kind === "unsure")
    callout = `<div class="callout ok">${ICON.check}<div>The AI says <b>${FACTS.genre.opts[facts.genre][0].toLowerCase()}</b>: “${esc(book.readingA.genre.reason)}”</div></div>`
  else if (agrees)
    callout = `<div class="callout ok">${ICON.check}<div>The AI agrees: “${esc(book.readingA.genre.reason)}”</div></div>`
  else
    callout = `<div class="callout flag">${ICON.flag}<div>The pages we read look like <b>${FACTS.genre.opts[A.genre][0].toLowerCase()}</b> to the AI (“${esc(book.readingA.genre.reason)}”). <b>We're going with your answer:</b> you know the whole book.${thumbs(book, book.readingA.genre.evidencePages.slice(0, 5)).replace('class="thumbs"', 'class="thumbs" style="margin-top:8px"')}</div></div>`

  // facts the AI filled, only those that matter for the chosen kind
  const relevant = { story: ["composition", "diagrams"], textbook: ["exercises", "diagrams"], reference: ["diagrams"] }[facts.genre]
  let rows = relevant.map((k) => {
    const f = FACTS[k], R = book.readingA[k]
    return `<div class="factrow"><div class="q">${f.q}</div><div class="row wrapflex" style="margin:6px 0" data-fact="${k}">${Object.entries(f.opts).map(([o, [l]]) => `<button class="chip" data-v="${o}" aria-pressed="${facts[k] === o}">${l}${o === R.answer ? '<span class="ai">AI</span>' : ""}</button>`).join("")}</div>
      <p class="small muted">“${esc(R.reason)}”</p><div style="margin-top:6px">${thumbs(book, R.evidencePages.slice(0, 4), R.evidencePages)}</div></div>`
  }).join("")

  const was = (k) => (flashFrom && flashFrom[k].value !== s[k].value ? `<span class="was">${SETTINGS[k].vals[flashFrom[k].value]}</span>` : "")
  const fl = (k) => (flashFrom && flashFrom[k].value !== s[k].value ? "flash" : "")

  $("#main").innerHTML = `<div class="result">
    <button class="btn ghost small" id="back">&larr; Change what it is</button>
    <div class="youSaid"><img src="${img(book, 1)}" alt="" style="width:48px;border-radius:5px;border:1px solid var(--line)"><div><p class="small faint">${esc(book.title)}</p><h1>${kind === "unsure" ? "The AI's pick" : "You said"}: ${FACTS.genre.opts[facts.genre][0]}</h1></div></div>
    ${callout}
    <div class="cols">
      <div><h2 style="margin-bottom:10px">The AI filled in the rest</h2><div class="card">${rows}</div>
        <p class="tiny faint" style="margin-top:8px">Only the questions that matter for a ${facts.genre === "reference" ? "reference book" : facts.genre} are shown.</p></div>
      <div>
        <div class="locked"><div class="locked-head">${ICON.lock.replace("<svg", '<svg width="18" height="18"')}<div><h3>Fixed at import</h3><p class="tiny">Measured from the PDF. Changing these later means importing again.</p></div></div>
          ${LOCKED.map((k) => { const ev = lockedEvidence(book, k, facts); return `<div class="lockitem setting ${fl(k)}" style="display:block"><div class="small muted">${SETTINGS[k].name}</div><div style="font-weight:600">${SETTINGS[k].vals[s[k].value]}${was(k)}</div><p class="tiny muted" style="margin:4px 0 6px">${esc(ev.text)}</p>${ev.html}</div>` }).join("")}
        </div>
        <div class="card" style="margin-top:14px"><div class="ghead"><h3>Can change later</h3>${laterBadge()}</div><div class="group">
          ${CHEAP.map((k) => `<div class="setting ${fl(k)}"><span class="name">${SETTINGS[k].name}</span><span></span><span class="val">${SETTINGS[k].vals[s[k].value]}${was(k)}</span><span></span><span class="why">${esc(s[k].rule)}</span></div>`).join("")}
        </div></div>
        <button class="btn primary" id="create" style="width:100%;margin-top:14px" ${kind === "unsure" && flaggedGenre && !facts._confirmed ? "disabled" : ""}>Create book</button>
      </div>
    </div>
    <p class="note">Prototype. Real answers, reasons and cited pages from ${esc(DATA.source)}. In the real E8 variant the AI answers the other questions after the user's pick; here we reuse its unprompted answers.</p>
  </div>`
}

function render() {
  renderBookTabs(book.id, pick)
  kind ? step2() : step1()
  flashFrom = null
}

document.addEventListener("click", (e) => {
  const k = e.target.closest("[data-kind]")
  if (k) { line = ($("#line") || {}).value || ""; kind = k.dataset.kind; facts = null; render(); scrollTo(0, 0); return }
  const o = e.target.closest("[data-fact] [data-v]")
  if (o) {
    flashFrom = decide(book.measured, facts)
    const f = o.closest("[data-fact]").dataset.fact
    facts[f] = o.dataset.v
    if (f === "genre") facts._confirmed = true
    render(); return
  }
  if (e.target.id === "back") { kind = null; facts = null; render(); return }
  if (e.target.id === "create") e.target.outerHTML = `<p class="badge ok" style="margin-top:14px">${ICON.check}Created (prototype)</p>`
})

function pick(id) { book = bookById(id); kind = null; facts = null; setParam("book", id); render() }

setupTheme()
setupLightbox(() => book)
render()
</script>
</body>
</html>
