name = "adt-publish"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
MGMT_SECRET = "local-dev-secret"

[[d1_databases]]
binding = "DB"
database_name = "adt-publish"
database_id = "local-dev"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "adt-publish-snapshots"

[[durable_objects.bindings]]
name = "PUBLICATION_ROOM"
class_name = "PublicationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PublicationRoom"]
