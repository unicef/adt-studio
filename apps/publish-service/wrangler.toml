name = "adt-publish"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
MGMT_SECRET = "local-dev-secret"

[[d1_databases]]
binding = "DB"
database_name = "adt-publish"
database_id = "local-dev"
migrations_dir = "migrations"

[assets]
binding = "ASSETS"
directory = "./assets"

# Retained only for workerd integration tests while the Studio-side uploader migrates.
# The deploy artifact is generated from scripts/build-artifact.mjs and does not include it.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "adt-publish-test-snapshots"
