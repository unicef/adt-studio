<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>ADT Studio</title>
    <script>
      // Paint the stored theme before the first frame, so the app never flashes
      // the wrong palette on launch. src/lib/theme.ts owns it from then on and
      // reads the same key; keep the two in step.
      (function () {
        try {
          var mode = localStorage.getItem("adt.theme") || "light";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (err) {
          /* private mode or storage disabled — fall back to light */
        }
      })();
      (function () {
        try {
          var mode = localStorage.getItem("adt.effects") || "auto";
          var hw = (window.api && window.api.hardware) || {
            cores: navigator.hardwareConcurrency,
            memoryGb: navigator.deviceMemory,
          };
          var lowEnd =
            hw.softwareRendering === true ||
            (hw.cores > 0 && hw.cores <= 4) ||
            (hw.memoryGb > 0 && hw.memoryGb <= 4);
          var reduced =
            mode === "on" ||
            (mode === "auto" &&
              (lowEnd ||
                window.matchMedia("(prefers-reduced-motion: reduce)").matches));
          document.documentElement.classList.toggle("reduce-effects", reduced);
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
